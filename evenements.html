<script>

function startCountdown(timestamp, elementId) {

    function update() {

        const now = Date.now();

        const distance = timestamp - now;

        const element =
            document.getElementById(elementId);

        if (!element) {
            return;
        }

        if (distance <= 0) {

            element.innerHTML =
                "🔴 Événement en cours !";

            return;

        }

        const jours =
            Math.floor(
                distance / (1000 * 60 * 60 * 24)
            );

        const heures =
            Math.floor(
                (distance % (1000 * 60 * 60 * 24))
                / (1000 * 60 * 60)
            );

        const minutes =
            Math.floor(
                (distance % (1000 * 60 * 60))
                / (1000 * 60)
            );

        const secondes =
            Math.floor(
                (distance % (1000 * 60))
                / 1000
            );

        element.innerHTML =
            `⏳ ${jours}j ${heures}h ${minutes}m ${secondes}s`;

    }

    update();

    setInterval(update, 1000);

}


async function chargerEvents() {

    try {

        const response =
            await fetch(
                "https://la-communaute-live-bot.de.deplexo.com/events"
            );

        if (!response.ok) {

            throw new Error(
                "Erreur HTTP " + response.status
            );

        }

        const events =
            await response.json();

        const container =
            document.getElementById("events");


        if (!events || events.length === 0) {

            container.innerHTML = `

                <div class="event-card">

                    <h2>
                        Aucun événement prévu
                    </h2>

                    <p>
                        Aucun événement Discord n'est actuellement programmé.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        events.forEach(event => {

            const date =
                new Date(event.startTime);


            const countdownId =
                `countdown-${event.startTime}`;


            container.innerHTML += `

                <div class="event-card">

                    <h2>
                        ${event.name}
                    </h2>

                    <p>
                        ${event.description || "Aucune description"}
                    </p>

                    <p class="date">

                        📅
                        ${date.toLocaleDateString("fr-FR")}
                        à
                        ${date.toLocaleTimeString(
                            "fr-FR",
                            {
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        )}

                    </p>

                    <p
                        class="countdown"
                        id="${countdownId}"
                    >
                        ⏳ Chargement...
                    </p>

                </div>

            `;


            startCountdown(
                event.startTime,
                countdownId
            );

        });

    }
    catch (error) {

        console.error(error);

        document.getElementById("events").innerHTML = `

            <div class="event-card">

                <h2>
                    ❌ Impossible de charger les événements
                </h2>

                <p>
                    Vérifie que le bot Discord est bien connecté.
                </p>

            </div>

        `;

    }

}


chargerEvents();

setInterval(
    chargerEvents,
    60000
);

</script>
