
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord — La communauté live</title>
    <link rel="stylesheet" href="css/style.css?v=20261013">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: #f8fafc;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(ellipse at 8% 5%, rgba(88,101,242,.20), transparent 35%),
                radial-gradient(ellipse at 95% 90%, rgba(0,217,255,.08), transparent 35%),
                #080b14;
        }

        .dashboard {
            width: min(1200px, 92%);
            margin: 0 auto;
            padding: 95px 0 55px;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin: 0 0 28px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 5vw, 3rem);
            background: linear-gradient(90deg, #38bdf8, #818cf8, #d946ef);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p { margin: 0; color: #9aabc5; line-height: 1.6; }

        .account-card {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 250px;
            padding: 13px 17px;
            background: rgba(15,23,42,.85);
            border: 1px solid #25314a;
            border-radius: 16px;
        }

        .avatar {
            width: 60px !important;
            height: 60px !important;
            min-width: 60px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #6577ff;
            background: #1e293b;
        }

        .account-name { font-weight: 700; }
        .account-role { color: #7db6ff; font-size: .85rem; margin-top: 5px; }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4ade80;
            font-size: .75rem;
            margin-top: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
        }

        .loading, .error {
            padding: 20px;
            border-radius: 14px;
            background: #10182a;
            border: 1px solid #26324a;
        }

        .error { color: #fca5a5; }

        .member-card-section {
            margin: 0 0 30px;
        }

        .member-card-section[hidden] { display: none !important; }

        .section-title {
            margin: 28px 0 15px;
            font-size: 1.2rem;
        }

        /* Carte membre améliorée */

        .member-card {
            position: relative;
            isolation: isolate;
            display: flex;
            align-items: center;
            gap: 24px;
            overflow: hidden;
            padding: 27px;
            min-height: 205px;
            border: 1px solid rgba(129,140,248,.5);
            border-radius: 22px;
            background:
                radial-gradient(circle at 90% 20%, rgba(0,217,255,.18), transparent 33%),
                linear-gradient(125deg, #171e3a, #0c1325 65%, #111c35);
            box-shadow: 0 18px 45px rgba(0,0,0,.22);
        }

        .member-card::before {
            content: "";
            position: absolute;
            z-index: -1;
            width: 250px;
            height: 250px;
            right: -85px;
            bottom: -155px;
            border-radius: 50%;
            border: 1px solid rgba(129,140,248,.28);
            box-shadow:
                0 0 0 22px rgba(129,140,248,.04),
                0 0 0 45px rgba(129,140,248,.035);
        }

        .member-card-avatar {
            flex-shrink: 0;
            width: 112px;
            height: 112px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #8291ff;
            background: #1e293b;
            box-shadow: 0 0 0 8px rgba(99,102,241,.10),
                        0 0 30px rgba(88,101,242,.22);
        }

        .member-card-info { flex: 1; min-width: 0; }

        .member-card-label {
            color: #93a9ff;
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px;
        }

        .member-card-info h2 {
            overflow-wrap: anywhere;
            font-size: clamp(1.5rem, 3vw, 2rem);
            margin: 0 0 10px;
        }

        .member-card-role {
            display: inline-flex;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: .82rem;
            color: #dbeafe;
            background: rgba(99,102,241,.2);
            border: 1px solid rgba(129,140,248,.4);
            margin: 0 0 13px;
        }

        .member-card-roles {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .member-role {
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);
            color: #cbd5e1;
            font-size: .78rem;
        }

        .member-card-id {
            margin-top: 14px;
            color: #91a3c2;
            font-size: .76rem;
            overflow-wrap: anywhere;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        .tool-card {
            display: block;
            min-width: 0;
            min-height: 138px;
            padding: 19px;
            border-radius: 17px;
            background: linear-gradient(145deg, rgba(17,26,45,.96), rgba(12,19,34,.96));
            border: 1px solid #202b40;
            color: inherit;
            text-decoration: none;
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        .tool-card:hover {
            transform: translateY(-3px);
            border-color: rgba(129,140,248,.6);
            box-shadow: 0 12px 30px rgba(0,0,0,.2);
        }

        .tool-icon { font-size: 1.8rem; margin-bottom: 12px; }
        .tool-card h3 { margin: 0 0 7px; font-size: .98rem; }
        .tool-card p { margin: 0; color: #9aabc5; font-size: .84rem; line-height: 1.5; }

        .role-box {
            padding: 20px;
            border-radius: 17px;
            background: rgba(15,23,42,.8);
            border: 1px solid #202b40;
        }

        .roles { display: flex; flex-wrap: wrap; gap: 8px; }

        .role {
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(88,101,242,.15);
            border: 1px solid rgba(88,101,242,.3);
            color: #c7d2fe;
            font-size: .85rem;
        }

        .permission-count { color: #94a3b8; margin-top: 10px; font-size: .85rem; }

        .logout {
            margin-top: 25px;
            padding: 11px 16px;
            border: 1px solid rgba(248,113,113,.3);
            border-radius: 10px;
            background: rgba(127,29,29,.18);
            color: #fca5a5;
            cursor: pointer;
        }

        .logout:hover { background: rgba(127,29,29,.3); }

        @media (max-width: 950px) {
            .tools-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 650px) {
            .dashboard { padding-top: 82px; }
            .hero { flex-direction: column; align-items: stretch; }
            .account-card { min-width: 0; }
            .member-card { flex-direction: column; align-items: flex-start; padding: 22px; gap: 20px; }
            .member-card-avatar { width: 92px; height: 92px; }
            .tools-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
<nav class="navbar" id="navbar"></nav>

<main class="dashboard">
    <div id="loading" class="loading">🔄 Chargement de ton espace...</div>

    <div id="content" style="display:none">
        <section class="hero">
            <div>
                <h1>👋 Bonjour !</h1>
                <p>Bienvenue dans le tableau de bord de <strong>La communauté live</strong>.</p>
            </div>

            <div class="account-card">
                <img id="avatar" class="avatar"
                     src="https://cdn.discordapp.com/embed/avatars/0.png"
                     alt="Avatar Discord">
                <div>
                    <div id="username" class="account-name"></div>
                    <div id="mainRole" class="account-role"></div>
                    <div class="status"><span class="status-dot"></span>Connecté avec Discord</div>
                </div>
            </div>
        </section>

        <section id="memberCardSection" class="member-card-section" hidden>
            <h2 class="section-title">🪪 Ma carte membre</h2>
            <div class="member-card">
                <img id="memberCardAvatar" class="member-card-avatar"
                     src="https://cdn.discordapp.com/embed/avatars/0.png"
                     alt="Photo du membre">

                <div class="member-card-info">
                    <p class="member-card-label">LA COMMUNAUTÉ LIVE · CARTE MEMBRE</p>
                    <h2 id="memberCardUsername">Membre Discord</h2>
                    <div id="memberCardRole" class="member-card-role">Membre</div>
                    <div id="memberCardRoles" class="member-card-roles"></div>
                    <div class="member-card-id">
                        ID Discord : <span id="memberCardId">Non disponible</span>
                    </div>
                </div>
            </div>
        </section>

        <h2 class="section-title">🛠️ Tes outils</h2>
        <section id="tools" class="tools-grid"></section>

        <h2 class="section-title">🛡️ Tes rôles Discord</h2>
        <section class="role-box">
            <div id="roles" class="roles"></div>
            <div id="permissionCount" class="permission-count"></div>
        </section>

        <button id="logout" class="logout" type="button">🚪 Se déconnecter</button>
    </div>
</main>

<script src="js/navbar.js?v=20261013"></script>
<script>
const API_URL = "https://la-communaute-live-bot.de.deplexo.com";

const TOOLS = [
    {
        permission: "level_money",
        icon: "💰",
        title: "Niveau + argent",
        description: "Voir ton niveau, ton XP et ton solde.",
        link: "niveau-argent.html"
    },
    {
        permission: "member_list",
        icon: "👥",
        title: "Liste des membres",
        description: "Consulter les membres du serveur.",
        link: "membres.html"
    },
    {
        permission: "sanctions_total",
        icon: "⚠️",
        title: "Sanctions",
        description: "Consulter les sanctions des membres."
    },
    {
        permission: "view_own_sanctions",
        icon: "📋",
        title: "Mes sanctions",
        description: "Consulter tes propres sanctions."
    },
    {
        permission: "discord_mobile",
        icon: "📱",
        title: "Discord mobile",
        description: "Accéder aux informations Discord mobile."
    },
    {
        permission: "discord_pc",
        icon: "💻",
        title: "Discord PC",
        description: "Accéder aux informations Discord PC."
    },
    {
        permission: "server_logs",
        icon: "📜",
        title: "Logs du serveur",
        description: "Consulter les journaux du serveur."
    },
    {
        permission: "create_event",
        icon: "📅",
        title: "Créer un événement",
        description: "Créer un nouvel événement Discord."
    },
    {
        permission: "create_announcement",
        icon: "📢",
        title: "Créer une annonce",
        description: "Créer une annonce pour la communauté."
    },
    {
        permission: "deplexo_links",
        icon: "🔗",
        title: "Liens Deplexo",
        description: "Accéder aux liens et informations Deplexo."
    },
    {
        permission: "bot_status",
        icon: "🤖",
        title: "Statut du bot",
        description: "Consulter l'état du bot Discord."
    }
];

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* Le backend renvoie déjà une URL complète pour user.avatar.
   On accepte aussi un hash au cas où le format changerait. */
function getAvatarURL(user) {
    const avatar = user?.avatarURL || user?.avatar_url || user?.avatar;

    if (typeof avatar === "string" && /^https?:\/\//i.test(avatar)) {
        return avatar;
    }

    if (typeof avatar === "string" && avatar && user?.id) {
        return `https://cdn.discordapp.com/avatars/${user.id}/${avatar}.png?size=256`;
    }

    return "https://cdn.discordapp.com/embed/avatars/0.png";
}

function setAvatar(element, url) {
    element.onerror = function () {
        this.onerror = null;
        this.src = "https://cdn.discordapp.com/embed/avatars/0.png";
    };
    element.src = url;
}

async function loadDashboard() {
    const token = localStorage.getItem("discord_session");

    if (!token) {
        showError("Tu dois être connecté avec Discord.");
        return;
    }

    try {
        const response = await fetch(`${API_URL}/auth/permissions`, {
            headers: { Authorization: `Bearer ${token}` }
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Impossible de récupérer les permissions.");
        }

        renderDashboard(data);
    } catch (error) {
        console.error(error);
        showError(error.message || "Une erreur est survenue.");
    }
}

function renderDashboard(data) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";

    const user = data.user || {};
    const roles = data.roles || [];
    const permissions = data.permissions || [];
    const username = user.globalName || user.global_name || user.username || "Utilisateur Discord";
    const avatarURL = getAvatarURL(user);
    const mainRole = roles.length ? roles[0].name : "@everyone";

    document.getElementById("username").textContent = user.username || username;
    document.getElementById("mainRole").textContent = mainRole;
    setAvatar(document.getElementById("avatar"), avatarURL);

    const cardSection = document.getElementById("memberCardSection");
    cardSection.hidden = !permissions.includes("own_card");

    document.getElementById("memberCardUsername").textContent = username;
    document.getElementById("memberCardRole").textContent = mainRole;
    document.getElementById("memberCardId").textContent = user.id || "Non disponible";
    setAvatar(document.getElementById("memberCardAvatar"), avatarURL);

    document.getElementById("memberCardRoles").innerHTML = roles.length
        ? roles.map(role => `<span class="member-role">${escapeHTML(role.name)}</span>`).join("")
        : '<span class="member-role">@everyone</span>';

    document.getElementById("roles").innerHTML = roles.length
        ? roles.map(role => `<span class="role">${escapeHTML(role.name)}</span>`).join("")
        : '<span class="role">@everyone</span>';

    document.getElementById("permissionCount").textContent =
        `${permissions.length} permission(s) active(s)`;

    const allowedTools = TOOLS.filter(tool => permissions.includes(tool.permission));

    document.getElementById("tools").innerHTML = allowedTools.map(tool => {
        const contents = `
            <div class="tool-icon">${tool.icon}</div>
            <h3>${escapeHTML(tool.title)}</h3>
            <p>${escapeHTML(tool.description)}</p>
        `;

        if (tool.link) {
            return `<a class="tool-card" href="${escapeHTML(tool.link)}">${contents}</a>`;
        }

        return `<article class="tool-card">${contents}</article>`;
    }).join("");
}

function showError(message) {
    const loading = document.getElementById("loading");
    loading.className = "error";
    loading.textContent = `❌ ${message}`;
}

document.getElementById("logout").addEventListener("click", () => {
    localStorage.removeItem("discord_session");
    window.location.href = "index.html";
});

loadDashboard();
</script>
</body>
</html>
