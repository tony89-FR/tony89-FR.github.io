<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Règlement - La communauté live</title>

    <meta
        name="description"
        content="Consultez le règlement officiel de La communauté live."
    >

    <link rel="icon" href="images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="ccs/style.css">

</head>


<body>

<canvas id="particles"></canvas>


<!-- ==================================================
     NAVIGATION
     Chargée depuis js/navbar.js
================================================== -->

<nav
    class="navbar"
    id="navbar"
></nav>


<!-- ==================================================
     HERO
================================================== -->

<header class="hero">

    <h1>
        📜 Règlement
    </h1>

    <p>
        Les règles de La communauté live,
        synchronisées automatiquement avec Discord.
    </p>

</header>


<!-- ==================================================
     RÈGLEMENT
================================================== -->

<section>

    <div id="rulesContainer">

        <div class="feature">

            <h3>
                ⏳ Chargement...
            </h3>

            <p>
                Récupération du règlement depuis Discord.
            </p>

        </div>

    </div>

</section>


<!-- ==================================================
     FOOTER
================================================== -->

<footer>

    © 2026 La communauté live

</footer>


<!-- ==================================================
     JAVASCRIPT
================================================== -->

<!-- 🧠 Navbar centrale -->
<script src="js/navbar.js"></script>


<!-- Règlement Discord -->

<script>

const RULES_API =
    "https://la-communaute-live-bot.de.deplexo.com/regles";


async function loadRules() {

    const container =
        document.getElementById(
            "rulesContainer"
        );


    try {

        const response =
            await fetch(RULES_API);


        if (!response.ok) {

            throw new Error(
                "Erreur HTTP " + response.status
            );

        }


        const rules =
            await response.json();


        if (
            !rules ||
            !rules.content
        ) {

            container.innerHTML = `

                <div class="feature">

                    <h3>
                        📜 Règlement
                    </h3>

                    <p>
                        Aucun règlement disponible.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = `

            <div class="feature">

                <h2>
                    📜 Règlement officiel
                </h2>

                <div
                    style="
                        white-space:pre-wrap;
                        text-align:left;
                        margin-top:25px;
                        line-height:1.8;
                    "
                >
                    ${rules.content.replace(
                        /\*\*(.*?)\*\*/g,
                        "<strong>$1</strong>"
                    )}
                </div>

            </div>

        `;

    }
    catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="feature">

                <h3>
                    ❌ Impossible de charger le règlement
                </h3>

                <p>
                    Vérifie que le bot Discord est bien connecté
                    et que le salon du règlement est accessible.
                </p>

            </div>

        `;

    }

}


loadRules();

</script>


<!-- Animations + menu mobile -->
<script src="js/app.js"></script>


</body>

</html>
