</head>

<body>

<canvas id="particles"></canvas>

<nav class="navbar">

    <div class="logo-nav">

        <img src="images/logo.png" alt="Logo">

        <span>La communauté live</span>

    </div>

    <ul class="nav-links">

        <li>

                href="https://discord.gg/HkcC9Kj29Z"
                target="_blank"
                rel="noopener noreferrer"
            >
                Rejoindre
            </a>
        </li>

    </ul>

</nav>


<header class="hero">

    <h1>📜 Règlement</h1>

    <p>
        Les règles de La communauté live,
        synchronisées automatiquement avec Discord.
    </p>

</header>


<section>

    <div id="rulesContainer">

        <div class="feature">

            <h3>⏳ Chargement...</h3>

            <p>
                Récupération du règlement depuis Discord.
            </p>

        </div>

    </div>

</section>


<footer>

    © 2026 La communauté live

</footer>


<script>

const RULES_API =
    "https://la-communaute-live-bot.de.deplexo.com/regles";


async function loadRules() {

    const container =
        document.getElementById("rulesContainer");

    try {

        const response =
            await fetch(RULES_API);

        if (!response.ok) {

            throw new Error(
                "Erreur HTTP " + response.status
            );

        }

        const rules =
            await response.json();

        if (!rules || !rules.content) {

            container.innerHTML = `

                <div class="feature">

                    <h3>📜 Règlement</h3>

                    <p>
                        Aucun règlement disponible.
                    </p>

                </div>

            `;

            return;

        }

        container.innerHTML = `

            <div class="feature">

                <h2>📜 Règlement officiel</h2>

                <div
                    style="
                        white-space:pre-wrap;
                        text-align:left;
                        margin-top:25px;
                        line-height:1.8;
                    "
                >
                    ${rules.content.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")}
                </div>

            </div>

        `;

    } catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="feature">

                <h3>❌ Impossible de charger le règlement</h3>

                <p>
                    Vérifie que le bot Discord est bien connecté
                    et que le salon du règlement est accessible.
                </p>

            </div>

        `;

    }

}


loadRules();

</script>


<script src="js/app.js"></script>

</body>

</html>
