<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discord mobile — La Communauté Live</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #1e1f22;
            --sidebar: #2b2d31;
            --chat: #313338;
            --field: #383a40;
            --muted: #b5bac1;
            --text: #f2f3f5;
            --accent: #5865f2;
            --border: #242529;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100dvh;
            overflow: hidden;
            color: var(--text);
            background: var(--background);
            font-family: Arial, Helvetica, sans-serif;
        }
        button, textarea { font: inherit; }
        button { cursor: pointer; }
        .app { display: flex; height: 100dvh; width: 100%; }
        .sidebar {
            display: flex;
            flex-direction: column;
            width: 275px;
            min-width: 230px;
            background: var(--sidebar);
            border-right: 1px solid #191a1c;
        }
        .server-title {
            padding: 20px 16px;
            font-size: 17px;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-heading {
            padding: 19px 14px 7px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        #channelList { flex: 1; padding: 0 8px 12px; overflow-y: auto; }
        .category-name {
            margin: 15px 8px 5px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .channel-button {
            width: 100%;
            margin: 2px 0;
            padding: 9px 10px;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: var(--muted);
            text-align: left;
            overflow-wrap: anywhere;
        }
        .channel-button:hover, .channel-button.active {
            background: #404249;
            color: #fff;
        }
        .sidebar-bottom {
            padding: 12px;
            color: var(--muted);
            background: #232428;
            font-size: 12px;
        }
        .chat { display: flex; flex: 1; min-width: 0; flex-direction: column; background: var(--chat); }
        .topbar {
            display: flex;
            min-height: 62px;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 5px #0002;
        }
        .topbar h1 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
        .hash { color: var(--muted); font-size: 23px; }
        .menu-button {
            display: none;
            border: 0;
            border-radius: 5px;
            padding: 8px 11px;
            color: white;
            background: #404249;
        }
        .messages { flex: 1; padding: 18px 22px; overflow-y: auto; }
        .state-message { padding: 28px 12px; color: var(--muted); text-align: center; line-height: 1.6; }
        .message { display: flex; gap: 12px; padding: 9px 0; }
        .message:hover { background: #0000000a; }
        .avatar { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; object-fit: cover; background: #404249; }
        .message-main { flex: 1; min-width: 0; }
        .message-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-bottom: 5px; }
        .author { font-size: 14px; font-weight: 700; }
        .bot-tag { color: #c9cdfb; background: #5865f244; padding: 2px 4px; border-radius: 3px; font-size: 10px; text-transform: uppercase; }
        .time { color: var(--muted); font-size: 11px; }
        .message-content { font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; white-space: normal; }
        .mention { padding: 1px 3px; border-radius: 3px; color: #c9cdfb; background: #5865f244; font-weight: 600; }
        .attachment { display: inline-block; margin-top: 6px; color: #00a8fc; overflow-wrap: anywhere; }
        .composer-wrap { position: relative; padding: 0 18px 17px; }
        .composer { display: flex; align-items: flex-end; gap: 10px; padding: 10px; border-radius: 9px; background: var(--field); }
        #messageInput {
            flex: 1;
            width: 100%;
            min-height: 40px;
            max-height: 180px;
            resize: vertical;
            padding: 10px 4px;
            border: 0;
            outline: none;
            color: white;
            background: transparent;
            line-height: 1.45;
        }
        #sendButton { min-height: 40px; padding: 10px 15px; border: 0; border-radius: 6px; color: white; background: var(--accent); font-weight: 700; }
        #sendButton:disabled { cursor: wait; opacity: .55; }
        .hint { margin: 8px 2px 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
        #status { min-height: 18px; padding: 0 18px 8px; color: var(--muted); font-size: 12px; }
        #status.error { color: #ff7777; }
        #status.success { color: #57f287; }
        #mentionSuggestions {
            position: absolute;
            z-index: 5;
            right: 18px;
            bottom: 100%;
            left: 18px;
            max-height: 250px;
            margin-bottom: 6px;
            overflow-y: auto;
            border: 1px solid #454750;
            border-radius: 8px;
            background: #232428;
            box-shadow: 0 8px 24px #0005;
        }
        .suggestion { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 12px; border: 0; color: white; background: transparent; text-align: left; }
        .suggestion:hover, .suggestion:focus { background: #404249; }
        .suggestion img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .suggestion small { display: block; margin-top: 3px; color: var(--muted); }
        @media (max-width: 700px) {
            .sidebar {
                position: fixed;
                z-index: 10;
                inset: 0 auto 0 0;
                width: min(300px, 85vw);
                min-width: 0;
                transform: translateX(-105%);
                transition: transform .2s ease;
                box-shadow: 6px 0 24px #0006;
            }
            .sidebar.open { transform: translateX(0); }
            .menu-button { display: inline-block; }
            .topbar { padding: 10px 12px; }
            .messages { padding: 13px 11px; }
            .composer-wrap { padding: 0 9px 10px; }
            #mentionSuggestions { right: 9px; left: 9px; }
            #sendButton { padding: 10px 12px; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="server-title">🌐 La Communauté Live</div>
        <div class="sidebar-heading">Salons accessibles</div>
        <nav id="channelList"><div class="state-message">Chargement des salons…</div></nav>
        <div class="sidebar-bottom">Mini-interface Discord du site</div>
    </aside>

    <main class="chat">
        <header class="topbar">
            <button class="menu-button" id="menuButton" type="button" aria-label="Ouvrir les salons">☰</button>
            <span class="hash">#</span>
            <h1 id="channelTitle">Choisis un salon</h1>
        </header>
        <section class="messages" id="messages" aria-live="polite">
            <div class="state-message">Sélectionne un salon pour voir les messages.</div>
        </section>
        <div id="status" role="status"></div>
        <div class="composer-wrap">
            <div id="mentionSuggestions" hidden></div>
            <form class="composer" id="messageForm">
                <textarea id="messageInput" maxlength="2000" rows="1" disabled placeholder="Sélectionne d'abord un salon…"></textarea>
                <button id="sendButton" type="submit" disabled>Envoyer</button>
            </form>
            <p class="hint">Tape <strong>@</strong> puis un pseudo et sélectionne la personne dans la liste. Les messages envoyés depuis cette page seront publiés par le bot.</p>
        </div>
    </main>
</div>

<script>
"use strict";

const API_URL = "https://la-communaute-live-bot.de.deplexo.com";
const channelList = document.getElementById("channelList");
const messagesElement = document.getElementById("messages");
const channelTitle = document.getElementById("channelTitle");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const messageForm = document.getElementById("messageForm");
const statusElement = document.getElementById("status");
const suggestionsElement = document.getElementById("mentionSuggestions");
const sidebar = document.getElementById("sidebar");

let channels = [];
let selectedChannelId = null;
let selectedMentionIds = new Set();
let suggestionQuery = "";
let loadingMessages = false;
let sendingMessage = false;
let messageRefreshTimer = null;
let latestSearchNumber = 0;

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function safeImageURL(value) {
    return typeof value === "string" && value.startsWith("https://")
        ? value
        : "https://cdn.discordapp.com/embed/avatars/0.png";
}

function setStatus(message = "", type = "") {
    statusElement.textContent = message;
    statusElement.className = type;
}

async function apiRequest(path, options = {}) {
    const token = localStorage.getItem("discord_session");
    if (!token) {
        throw new Error("Tu n'es pas connecté. Connecte-toi d'abord avec Discord sur le site.");
    }

    const response = await fetch(API_URL + path, {
        method: options.method || "GET",
        headers: {
            Authorization: `Bearer ${token}`,
            ...(options.body ? { "Content-Type": "application/json" } : {})
        },
        ...(options.body ? { body: JSON.stringify(options.body) } : {})
    });

    let data = {};
    try { data = await response.json(); } catch { /* réponse non JSON */ }
    if (!response.ok) {
        throw new Error(data.error || `Erreur serveur : ${response.status}`);
    }
    return data;
}

function renderChannels() {
    if (!channels.length) {
        channelList.innerHTML = '<div class="state-message">Aucun salon accessible avec tes permissions.</div>';
        return;
    }

    let lastCategory = null;
    let html = "";
    for (const channel of channels) {
        const category = channel.categoryName || "Salons sans catégorie";
        if (category !== lastCategory) {
            html += `<div class="category-name">${escapeHTML(category)}</div>`;
            lastCategory = category;
        }
        html += `<button class="channel-button ${channel.id === selectedChannelId ? "active" : ""}" type="button" data-channel-id="${escapeHTML(channel.id)}"># ${escapeHTML(channel.name)}</button>`;
    }

    channelList.innerHTML = html;
    channelList.querySelectorAll("[data-channel-id]").forEach(button => {
        button.addEventListener("click", () => {
            const channel = channels.find(item => item.id === button.dataset.channelId);
            if (channel) selectChannel(channel);
        });
    });
}

function formatContent(content, mentions) {
    const users = new Map((mentions?.users || []).map(item => [item.id, item.name]));
    const roles = new Map((mentions?.roles || []).map(item => [item.id, item.name]));
    const mentionedChannels = new Map((mentions?.channels || []).map(item => [item.id, item.name]));
    const pattern = /<@!?(\d{17,20})>|<@&(\d{17,20})>|<#(\d{17,20})>/g;
    const text = String(content || "");
    let result = "";
    let lastIndex = 0;
    let match;

    while ((match = pattern.exec(text)) !== null) {
        result += escapeHTML(text.slice(lastIndex, match.index)).replace(/\n/g, "<br>");
        let label;
        if (match[1]) label = "@" + (users.get(match[1]) || "utilisateur");
        else if (match[2]) label = "@" + (roles.get(match[2]) || "rôle");
        else label = "#" + (mentionedChannels.get(match[3]) || "salon");
        result += `<span class="mention">${escapeHTML(label)}</span>`;
        lastIndex = pattern.lastIndex;
    }

    result += escapeHTML(text.slice(lastIndex)).replace(/\n/g, "<br>");
    return result;
}

function renderMessages(messages) {
    if (!messages.length) {
        messagesElement.innerHTML = '<div class="state-message">Aucun message dans ce salon pour le moment.</div>';
        return;
    }

    messagesElement.innerHTML = messages.map(message => {
        const author = message.author || {};
        const authorName = message.authorName || author.displayName || author.username || message.authorUsername || "Utilisateur";
        const authorAvatar = message.authorAvatar || author.avatar;
        const date = new Date(message.timestamp);
        const time = Number.isNaN(date.getTime()) ? "" : date.toLocaleString("fr-FR", {
            day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
        });

        const attachments = (message.attachments || []).filter(file =>
            file && typeof file.url === "string" && file.url.startsWith("https://")
        ).map(file => `<div>📎 <a class="attachment" href="${escapeHTML(file.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(file.name || "Fichier joint")}</a></div>`).join("");

        return `<article class="message">
            <img class="avatar" src="${escapeHTML(safeImageURL(authorAvatar))}" alt="" loading="lazy">
            <div class="message-main">
                <div class="message-meta">
                    <span class="author">${escapeHTML(authorName)}</span>
                    ${author.bot ? '<span class="bot-tag">Bot</span>' : ''}
                    <time class="time">${escapeHTML(time)}</time>
                </div>
                <div class="message-content">${formatContent(message.content, message.mentions)}</div>
                ${attachments}
            </div>
        </article>`;
    }).join("");

    messagesElement.scrollTop = messagesElement.scrollHeight;
}

async function loadMessages({ silent = false } = {}) {
    if (!selectedChannelId || loadingMessages) return;
    loadingMessages = true;
    const channelId = selectedChannelId;

    if (!silent) messagesElement.innerHTML = '<div class="state-message">Chargement des messages…</div>';

    try {
        const data = await apiRequest(`/chat/channels/${encodeURIComponent(channelId)}/messages`);
        if (selectedChannelId !== channelId) return;
        renderMessages(Array.isArray(data.messages) ? data.messages : []);
        if (!silent) setStatus();
    } catch (error) {
        if (selectedChannelId === channelId) {
            messagesElement.innerHTML = `<div class="state-message">${escapeHTML(error.message)}</div>`;
            setStatus(error.message, "error");
        }
    } finally {
        loadingMessages = false;
    }
}

function selectChannel(channel) {
    selectedChannelId = channel.id;
    channelTitle.textContent = channel.name;
    messageInput.disabled = false;
    messageInput.placeholder = `Écrire dans #${channel.name}`;
    sendButton.disabled = false;
    selectedMentionIds.clear();
    suggestionsElement.hidden = true;
    setStatus();
    sidebar.classList.remove("open");
    renderChannels();
    loadMessages();
}

async function loadChannels() {
    try {
        const data = await apiRequest("/chat/channels");
        channels = Array.isArray(data.channels) ? data.channels : [];
        channels.sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
        renderChannels();
        if (channels.length) selectChannel(channels[0]);
        else messagesElement.innerHTML = '<div class="state-message">Aucun salon disponible.</div>';
    } catch (error) {
        channelList.innerHTML = `<div class="state-message">${escapeHTML(error.message)}</div>`;
        setStatus(error.message, "error");
    }
}

function hideSuggestions() {
    suggestionsElement.hidden = true;
    suggestionsElement.innerHTML = "";
    suggestionQuery = "";
}

messageInput.addEventListener("input", async () => {
    // Si l'utilisateur modifie le texte après avoir choisi une mention,
    // ne garder que les identifiants dont le pseudo reste présent.
    const content = messageInput.value;
    for (const userId of [...selectedMentionIds]) {
        // Le backend vérifiera aussi que le @pseudo figure encore dans le texte.
        if (!content.includes("@")) selectedMentionIds.delete(userId);
    }

    const cursor = messageInput.selectionStart;
    const beforeCursor = content.slice(0, cursor);
    const match = beforeCursor.match(/@([a-zA-Z0-9_.]{1,32})$/);
    if (!match) {
        hideSuggestions();
        return;
    }

    const query = match[1];
    if (query === suggestionQuery) return;
    suggestionQuery = query;
    const searchNumber = ++latestSearchNumber;

    try {
        const data = await apiRequest(`/chat/members?q=${encodeURIComponent(query)}`);
        if (searchNumber !== latestSearchNumber) return;
        const latestBeforeCursor = messageInput.value.slice(0, messageInput.selectionStart);
        const latestMatch = latestBeforeCursor.match(/@([a-zA-Z0-9_.]{1,32})$/);
        if (!latestMatch || latestMatch[1] !== query) return;

        const members = Array.isArray(data.members) ? data.members : [];
        if (!members.length) {
            suggestionsElement.innerHTML = '<div class="state-message">Aucun membre trouvé.</div>';
            suggestionsElement.hidden = false;
            return;
        }

        suggestionsElement.innerHTML = members.map(member => `<button class="suggestion" type="button" data-user-id="${escapeHTML(member.id)}" data-username="${escapeHTML(member.username)}">
            <img src="${escapeHTML(safeImageURL(member.avatar))}" alt="">
            <span>${escapeHTML(member.displayName || member.username)}<small>@${escapeHTML(member.username)}</small></span>
        </button>`).join("");
        suggestionsElement.hidden = false;

        suggestionsElement.querySelectorAll("[data-user-id]").forEach(button => {
            button.addEventListener("click", () => {
                const userId = button.dataset.userId;
                const username = button.dataset.username;
                const text = messageInput.value;
                const currentCursor = messageInput.selectionStart;
                const prefix = text.slice(0, currentCursor);
                const atIndex = prefix.lastIndexOf("@");
                if (atIndex < 0) return;

                const start = text.slice(0, atIndex);
                const end = text.slice(currentCursor);
                const inserted = `@${username} `;
                messageInput.value = start + inserted + end;
                const newCursor = start.length + inserted.length;
                messageInput.focus();
                messageInput.setSelectionRange(newCursor, newCursor);
                selectedMentionIds.add(userId);
                hideSuggestions();
            });
        });
    } catch (error) {
        hideSuggestions();
        setStatus(error.message, "error");
    }
});

messageForm.addEventListener("submit", async event => {
    event.preventDefault();
    const content = messageInput.value.trim();
    if (!selectedChannelId || !content || sendingMessage) return;

    sendingMessage = true;
    sendButton.disabled = true;
    setStatus("Envoi du message…");

    try {
        await apiRequest(`/chat/channels/${encodeURIComponent(selectedChannelId)}/messages`, {
            method: "POST",
            body: {
                content,
                mentionUserIds: [...selectedMentionIds]
            }
        });
        messageInput.value = "";
        selectedMentionIds.clear();
        hideSuggestions();
        setStatus("Message envoyé par le bot.", "success");
        await loadMessages();
    } catch (error) {
        setStatus(error.message, "error");
    } finally {
        sendingMessage = false;
        sendButton.disabled = !selectedChannelId;
        messageInput.focus();
    }
});

// Ctrl+Entrée envoie le message, Entrée seule permet d'aller à la ligne.
messageInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        messageForm.requestSubmit();
    }
    if (event.key === "Escape") hideSuggestions();
});

document.getElementById("menuButton").addEventListener("click", () => {
    sidebar.classList.toggle("open");
});

document.addEventListener("click", event => {
    if (!suggestionsElement.contains(event.target) && event.target !== messageInput) {
        hideSuggestions();
    }
});

loadChannels();
messageRefreshTimer = setInterval(() => {
    if (selectedChannelId) loadMessages({ silent: true });
}, 20000);
</script>
</body>
</html>
