<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Membres — La communauté live</title>


    <style>

        /* ==================================================
           THÈME DU SITE
        ================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            background: #080b14;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(88,101,242,.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(0,217,255,.10),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #080b14,
                    #0d1220 55%,
                    #13041f
                );

            color: #f8fafc;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* ==================================================
           NAVBAR
        ================================================== */

        .navbar {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 70px;

            z-index: 1000;

            display: flex;

            align-items: center;

            padding:
                0 28px;

            background:
                rgba(8,11,20,.92);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

        }


        .navbar a {

            color:
                #e2e8f0;

            text-decoration:
                none;

        }


        /* ==================================================
           LOGO
        ================================================== */

        .logo-nav {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            flex-shrink:
                0;

        }


        .logo-nav img {

            width:
                42px;

            height:
                42px;

            object-fit:
                contain;

        }


        .logo-nav span {

            color:
                #ffffff;

            font-size:
                1.05rem;

            font-weight:
                800;

            white-space:
                nowrap;

        }


        /* ==================================================
           LIENS NAVIGATION
        ================================================== */

        .nav-links {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            margin-left:
                30px;

        }


        .nav-links a {

            padding:
                9px 12px;

            border-radius:
                9px;

            color:
                #cbd5e1;

            font-size:
                .88rem;

            transition:
                .2s ease;

        }


        .nav-links a:hover {

            background:
                rgba(88,101,242,.15);

            color:
                #ffffff;

        }


        /* ==================================================
           COMPTE DISCORD
        ================================================== */

        .discord-account-nav {

            margin-left:
                auto;

            position:
                relative;

        }


        .discord-account-button {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            padding:
                7px 10px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius:
                10px;

            background:
                rgba(15,23,42,.8);

            color:
                #ffffff;

            cursor:
                pointer;

        }


        .discord-avatar-nav {

            width:
                34px;

            height:
                34px;

            border-radius:
                50%;

            object-fit:
                cover;

        }


        .discord-account-name {

            color:
                #f8fafc;

            font-weight:
                700;

            font-size:
                .85rem;

        }


        .discord-status-nav {

            color:
                #86efac;

            font-size:
                .68rem;

        }


        /* ==================================================
           MENU MOBILE
        ================================================== */

        .menu-toggle {

            display:
                none;

            margin-left:
                auto;

            border:
                1px solid
                rgba(255,255,255,.10);

            background:
                rgba(15,23,42,.8);

            color:
                #ffffff;

            border-radius:
                9px;

            padding:
                9px 11px;

            font-size:
                1.2rem;

            cursor:
                pointer;

        }


        /* ==================================================
           PAGE
        ================================================== */

        .members-page {

            width:
                min(1500px, 94%);

            margin:
                0 auto;

            padding:
                110px 0 60px;

        }


        /* ==================================================
           HEADER
        ================================================== */

        .members-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

            margin-bottom:
                25px;

        }


        .members-title h1 {

            margin:
                0 0 7px;

            font-size:
                clamp(2rem, 4vw, 2.8rem);

        }


        .members-title p {

            margin:
                0;

            color:
                #94a3b8;

        }


        .back-button {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                11px 17px;

            border-radius:
                12px;

            background:
                rgba(88,101,242,.15);

            border:
                1px solid
                rgba(88,101,242,.30);

            color:
                #c7d2fe;

            text-decoration:
                none;

            transition:
                .2s;

            white-space:
                nowrap;

        }


        .back-button:hover {

            background:
                rgba(88,101,242,.28);

            transform:
                translateY(-2px);

        }


        /* ==================================================
           RECHERCHE
        ================================================== */

        .members-toolbar {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            margin-bottom:
                15px;

        }


        #search {

            flex:
                1;

            min-width:
                200px;

            padding:
                14px 17px;

            border-radius:
                13px;

            border:
                1px solid
                rgba(255,255,255,.08);

            background:
                rgba(15,23,42,.88);

            color:
                #ffffff;

            outline:
                none;

            font-size:
                .95rem;

        }


        #search::placeholder {

            color:
                #64748b;

        }


        #search:focus {

            border-color:
                rgba(96,165,250,.55);

            box-shadow:
                0 0 0 3px
                rgba(96,165,250,.08);

        }


        .member-count {

            padding:
                13px 17px;

            border-radius:
                13px;

            background:
                rgba(15,23,42,.88);

            border:
                1px solid
                rgba(255,255,255,.08);

            color:
                #94a3b8;

            white-space:
                nowrap;

        }


        /* ==================================================
           LISTE DES MEMBRES
        ================================================== */

        .members-list {

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

        }


        .member-row {

            display:
                grid;

            grid-template-columns:
                48px
                minmax(190px, 1.2fr)
                minmax(220px, 1fr)
                minmax(420px, 2fr);

            align-items:
                center;

            gap:
                16px;

            min-height:
                76px;

            padding:
                11px 15px;

            border-radius:
                14px;

            background:
                rgba(15,23,42,.78);

            border:
                1px solid
                rgba(255,255,255,.06);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.18);

            transition:
                .18s ease;

        }


        .member-row:hover {

            background:
                rgba(20,30,52,.96);

            border-color:
                rgba(96,165,250,.25);

            transform:
                translateY(-1px);

        }


        /* ==================================================
           AVATAR
        ================================================== */

        .member-avatar {

            width:
                48px;

            height:
                48px;

            border-radius:
                50%;

            object-fit:
                cover;

            background:
                #1e293b;

            border:
                2px solid
                rgba(255,255,255,.08);

        }


        /* ==================================================
           IDENTITÉ
        ================================================== */

        .member-name {

            min-width:
                0;

        }


        .display-name {

            display:
                flex;

            align-items:
                center;

            gap:
                5px;

            font-weight:
                700;

            color:
                #f8fafc;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .username {

            margin-top:
                4px;

            color:
                #64748b;

            font-size:
                .78rem;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .bot {

            display:
                inline-flex;

            align-items:
                center;

            padding:
                3px 6px;

            border-radius:
                6px;

            background:
                rgba(34,197,94,.13);

            color:
                #86efac;

            font-size:
                .62rem;

            font-weight:
                700;

        }


        /* ==================================================
           RÔLES
        ================================================== */

        .member-roles {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                5px;

        }


        .role {

            display:
                inline-flex;

            align-items:
                center;

            padding:
                5px 9px;

            border-radius:
                999px;

            background:
                rgba(88,101,242,.14);

            border:
                1px solid
                rgba(88,101,242,.22);

            color:
                #c7d2fe;

            font-size:
                .72rem;

            white-space:
                nowrap;

        }


        /* ==================================================
           ACTIONS
        ================================================== */

        .member-actions {

            display:
                flex;

            justify-content:
                flex-end;

            align-items:
                center;

            flex-wrap:
                wrap;

            gap:
                6px;

        }


        .action-button {

            border:
                1px solid
                rgba(255,255,255,.09);

            border-radius:
                8px;

            padding:
                8px 10px;

            background:
                rgba(30,41,59,.85);

            color:
                #e2e8f0;

            cursor:
                pointer;

            font-size:
                .73rem;

            font-weight:
                600;

            transition:
                .18s;

            white-space:
                nowrap;

        }


        .action-button:hover {

            transform:
                translateY(-1px);

            background:
                rgba(51,65,85,.98);

        }


        .action-temp {

            border-color:
                rgba(251,191,36,.25);

            color:
                #fcd34d;

        }


        .action-perm {

            border-color:
                rgba(248,113,113,.25);

            color:
                #fca5a5;

        }


        .action-role {

            border-color:
                rgba(167,139,250,.25);

            color:
                #c4b5fd;

        }


        .action-sanction {

            border-color:
                rgba(251,146,60,.25);

            color:
                #fdba74;

        }


        .action-card {

            border-color:
                rgba(96,165,250,.25);

            color:
                #93c5fd;

        }


        /* ==================================================
           MESSAGES
        ================================================== */

        .message {

            padding:
                30px;

            text-align:
                center;

            border-radius:
                15px;

            background:
                rgba(15,23,42,.85);

            border:
                1px solid
                rgba(255,255,255,.07);

            color:
                #94a3b8;

        }


        .message.error {

            color:
                #fca5a5;

            border-color:
                rgba(248,113,113,.25);

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 950px) {

            .nav-links {

                display:
                    none;

            }


            .menu-toggle {

                display:
                    block;

            }


            .discord-account-nav {

                display:
                    none;

            }


            .member-row {

                grid-template-columns:
                    48px
                    1fr
                    minmax(250px, 1fr);

            }


            .member-roles {

                display:
                    none;

            }

        }


        @media (max-width: 700px) {

            .navbar {

                padding:
                    0 15px;

            }


            .logo-nav span {

                display:
                    none;

            }


            .members-page {

                width:
                    94%;

                padding:
                    95px 0 40px;

            }


            .members-header {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .back-button {

                width:
                    100%;

            }


            .members-toolbar {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .member-count {

                text-align:
                    center;

            }


            .member-row {

                grid-template-columns:
                    44px
                    1fr;

                gap:
                    10px;

                padding:
                    12px;

            }


            .member-avatar {

                width:
                    44px;

                height:
                    44px;

            }


            .member-roles {

                display:
                    flex;

                grid-column:
                    1 / -1;

            }


            .member-actions {

                grid-column:
                    1 / -1;

                justify-content:
                    flex-start;

                padding-top:
                    8px;

                border-top:
                    1px solid
                    rgba(255,255,255,.05);

            }


            .action-button {

                flex:
                    1;

                min-width:
                    130px;

            }

        }

    </style>

</head>


<body>


<!-- ======================================================
     NAVBAR
====================================================== -->

<nav
    class="navbar"
    id="navbar"
>

    <a
        href="index.html"
        class="logo-nav"
    >

        <img
            src="assets/logo.png"
            alt="Logo"
            onerror="this.style.display='none'"
        >

        <span>
            La communauté live
        </span>

    </a>


    <div
        class="nav-links"
    >

        <a href="index.html">

        </a>

        <a href="evenements.html">

        </a>

        <a href="dashboard.html">

        </a>

    </div>


    <button
        class="menu-toggle"

    >

        ☰

    </button>

</nav>


<!-- ======================================================
     PAGE
====================================================== -->

<main class="members-page">


    <header class="members-header">


        <div class="members-title">

            <h1>
                👥 Membres
            </h1>

            <p>
                Gestion des membres de La communauté live
            </p>

        </div>


        <a
            href="dashboard.html"
            class="back-button"
        >

            ← Retour au dashboard

        </a>


    </header>


    <div class="members-toolbar">


        <input
            id="search"
            type="search"
            placeholder="🔎 Rechercher un pseudo, un rôle..."
            autocomplete="off"
        >


        <div
            id="memberCount"
            class="member-count"
        >

            Chargement...

        </div>


    </div>


    <section
        id="membersList"
        class="members-list"
    >

        <div class="message">

            🔄 Chargement des membres...

        </div>

    </section>


</main>


<script src="js/navbar.js"></script>


<script>

/* ======================================================
   CONFIGURATION
====================================================== */

const API_URL =
    "https://la-communaute-live-bot.de.deplexo.com";


let allMembers = [];

let myPermissions = [];


/* ======================================================
   ÉLÉMENTS
====================================================== */

const membersList =
    document.getElementById(
        "membersList"
    );


const searchInput =
    document.getElementById(
        "search"
    );


const memberCount =
    document.getElementById(
        "memberCount"
    );


/* ======================================================
   SÉCURITÉ
====================================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ======================================================
   AVATAR
====================================================== */

function getDefaultAvatar() {

    return (
        "https://cdn.discordapp.com/" +
        "embed/avatars/0.png"
    );

}


/* ======================================================
   PERMISSION
====================================================== */

function hasPermission(
    permission
) {

    return myPermissions.includes(
        permission
    );

}


/* ======================================================
   ACTIONS SELON LES PERMISSIONS
====================================================== */

function createActions(
    member
) {

    const actions = [];


    if (
        hasPermission("temp_ban")
    ) {

        actions.push(`

            <button
                class="action-button action-temp"
                data-action="temp-ban"
                data-member-id="${escapeHTML(member.id)}"
            >

                ⏳ Ban temporaire

            </button>

        `);

    }


    if (
        hasPermission("perm_ban")
    ) {

        actions.push(`

            <button
                class="action-button action-perm"
                data-action="perm-ban"
                data-member-id="${escapeHTML(member.id)}"
            >

                🔨 Ban définitif

            </button>

        `);

    }


    if (
        hasPermission("manage_roles")
    ) {

        actions.push(`

            <button
                class="action-button action-role"
                data-action="manage-role"
                data-member-id="${escapeHTML(member.id)}"
            >

                🎭 Rôles

            </button>

        `);

    }


    if (
        hasPermission("sanctions_total")
    ) {

        actions.push(`

            <button
                class="action-button action-sanction"
                data-action="sanctions"
                data-member-id="${escapeHTML(member.id)}"
            >

                📋 Sanctions

            </button>

        `);

    }


    if (
        hasPermission("own_card")
    ) {

        actions.push(`

            <button
                class="action-button action-card"
                data-action="card"
                data-member-id="${escapeHTML(member.id)}"
            >

                🪪 Carte

            </button>

        `);

    }


    if (
        !actions.length
    ) {

        return `

            <span
                style="
                    color:#64748b;
                    font-size:.75rem;
                "
            >

                Aucune action disponible

            </span>

        `;

    }


    return actions.join("");

}


/* ======================================================
   AFFICHAGE
====================================================== */

function renderMembers(
    members
) {

    memberCount.textContent =
        `${members.length} membre(s)`;


    if (
        !members.length
    ) {

        membersList.innerHTML = `

            <div class="message">

                🔎 Aucun membre trouvé.

            </div>

        `;

        return;

    }


    membersList.innerHTML =

        members
            .map(
                member => {


                    const roles =
                        member.roles || [];


                    const rolesHTML =

                        roles.length

                            ?

                            roles
                                .map(
                                    role => `

                                        <span
                                            class="role"
                                        >

                                            ${escapeHTML(
                                                role.name
                                            )}

                                        </span>

                                    `
                                )
                                .join("")

                            :

                            `

                                <span
                                    class="role"
                                >

                                    @everyone

                                </span>

                            `;


                    return `

                        <article
                            class="member-row"
                        >


                            <img
                                class="member-avatar"

                                src="${escapeHTML(
                                    member.avatar ||
                                    getDefaultAvatar()
                                )}"

                                alt="Avatar"

                                loading="lazy"

                            >


                            <div
                                class="member-name"
                            >

                                <div
                                    class="display-name"
                                >

                                    ${escapeHTML(
                                        member.displayName ||
                                        member.username ||
                                        "Membre"
                                    )}

                                    ${
                                        member.bot

                                            ?

                                            `
                                                <span class="bot">
                                                    BOT
                                                </span>
                                            `

                                            :

                                            ""
                                    }

                                </div>


                                <div
                                    class="username"
                                >

                                    @${escapeHTML(
                                        member.username ||
                                        ""
                                    )}

                                </div>

                            </div>


                            <div
                                class="member-roles"
                            >

                                ${rolesHTML}

                            </div>


                            <div
                                class="member-actions"
                            >

                                ${createActions(
                                    member
                                )}

                            </div>


                        </article>

                    `;

                }
            )
            .join("");

}


/* ======================================================
   CHARGEMENT
====================================================== */

async function loadMembers() {


    const token =
        localStorage.getItem(
            "discord_session"
        );


    if (!token) {

        membersList.innerHTML = `

            <div class="message error">

                ❌ Tu dois être connecté avec Discord.

            </div>

        `;

        memberCount.textContent =
            "Non connecté";

        return;

    }


    try {


        /* PERMISSIONS */

        const permissionsResponse =
            await fetch(

                `${API_URL}/auth/permissions`,

                {

                    headers: {

                        Authorization:
                            `Bearer ${token}`

                    }

                }

            );


        const permissionsData =
            await permissionsResponse.json();


        if (
            !permissionsResponse.ok
        ) {

            throw new Error(

                permissionsData.error ||
                "Impossible de récupérer tes permissions."

            );

        }


        myPermissions =
            permissionsData.permissions || [];


        /* MEMBRES */

        const membersResponse =
            await fetch(

                `${API_URL}/members`,

                {

                    headers: {

                        Authorization:
                            `Bearer ${token}`

                    }

                }

            );


        const membersData =
            await membersResponse.json();


        if (
            !membersResponse.ok
        ) {

            throw new Error(

                membersData.error ||
                "Impossible de récupérer les membres."

            );

        }


        allMembers =
            membersData.members || [];


        renderMembers(
            allMembers
        );


    } catch (error) {

        console.error(
            "Erreur membres :",
            error
        );


        membersList.innerHTML = `

            <div class="message error">

                ❌ ${escapeHTML(
                    error.message
                )}

            </div>

        `;


        memberCount.textContent =
            "Erreur";

    }

}


/* ======================================================
   RECHERCHE
====================================================== */

searchInput.addEventListener(

    "input",

    () => {


        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        if (!query) {

            renderMembers(
                allMembers
            );

            return;

        }


        const filtered =
            allMembers.filter(

                member => {


                    const name =
                        String(
                            member.displayName || ""
                        )
                            .toLowerCase();


                    const username =
                        String(
                            member.username || ""
                        )
                            .toLowerCase();


                    const roles =
                        member.roles || [];


                    return (

                        name.includes(query)

                        ||

                        username.includes(query)

                        ||

                        roles.some(

                            role =>

                                String(
                                    role.name || ""
                                )
                                    .toLowerCase()
                                    .includes(query)

                        )

                    );

                }

            );


        renderMembers(
            filtered
        );

    }

);


/* ======================================================
   ACTIONS
====================================================== */

membersList.addEventListener(

    "click",

    event => {


        const button =
            event.target.closest(
                ".action-button"
            );


        if (!button) {
            return;
        }


        const action =
            button.dataset.action;


        const memberId =
