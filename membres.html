
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Membres - La communauté live</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20261015-sanctions">

    <style>
        .members-page {
            min-height: 100vh;
            padding-top: 110px;
        }

        .members-section {
            width: min(1400px, 94%);
            margin: 0 auto;
            padding: 35px 0 80px;
        }

        .members-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .members-kicker {
            color: #00d9ff;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: .8rem;
        }

        .members-header h1 {
            margin: 10px 0;
            font-size: clamp(2rem, 5vw, 3.5rem);
        }

        .members-header p:last-child {
            max-width: 700px;
            margin: 0 auto;
            opacity: .75;
        }

        .members-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }

        .members-search {
            flex: 1;
            min-width: 220px;
            padding: 13px 16px;
            color: white;
            background: #101626;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            font: inherit;
            box-sizing: border-box;
        }

        /* =========================================
           LISTE DES MEMBRES : UNE GRANDE LIGNE PAR MEMBRE
           Profil à gauche, ID au centre, actions à droite
        ========================================= */

        .members-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .member-card {
            display: grid;
            grid-template-columns:
                minmax(190px, 1.1fr)
                minmax(140px, .8fr)
                minmax(300px, 1.8fr);
            align-items: center;
            gap: 20px;

            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 18px 22px;

            border-radius: 16px;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.08);
            backdrop-filter: blur(12px);

            transition:
                transform .25s ease,
                border-color .25s ease,
                background .25s ease;
        }

        .member-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0,217,255,.35);
            background: rgba(255,255,255,.075);
        }

        /* Profil du membre : colonne de gauche */
        .member-card-top {
            grid-column: 1;
            grid-row: 1;

            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .member-avatar {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0,217,255,.25);
        }

        .member-identity {
            min-width: 0;
        }

        .member-identity h2 {
            margin: 0 0 5px;
            font-size: 1.05rem;
            overflow-wrap: anywhere;
        }

        .member-identity span {
            display: block;
            color: #00d9ff;
            font-size: .8rem;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        /* Identifiant Discord : colonne du milieu */
        .member-id {
            grid-column: 2;
            grid-row: 1;

            min-width: 0;
            margin-top: 0;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(0,0,0,.2);
            color: rgba(255,255,255,.65);
            font-size: .75rem;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        /* Boutons d'action : colonne de droite */
        .member-actions {
            grid-column: 3;
            grid-row: 1;

            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;

            min-width: 0;
            margin-top: 0;
        }

        .member-action,
        .members-button,
        .dialog-button {
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            padding: 10px 12px;
            color: white;
            background: rgba(255,255,255,.08);
            cursor: pointer;
            font: inherit;
            font-size: .85rem;
            text-align: center;
            transition:
                background .2s ease,
                border-color .2s ease;
        }

        .member-action {
            flex: 1 1 135px;
            width: auto;
            min-width: 0;
            box-sizing: border-box;
        }

        .member-action:hover,
        .members-button:hover,
        .dialog-button:hover {
            background: rgba(0,217,255,.14);
            border-color: rgba(0,217,255,.3);
        }

        .member-action.danger {
            color: #ffabb5;
        }

        .member-no-action {
            grid-column: 3;
            grid-row: 1;

            display: block;
            min-width: 0;
            margin-top: 0;
            color: rgba(255,255,255,.55);
            font-size: .85rem;
        }

        /* =========================================
           HISTORIQUE DES SANCTIONS
        ========================================= */

        .sanction-entry {
            padding: 14px;
            margin: 10px 0;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 12px;
            background: rgba(255,255,255,.035);
        }

        .sanction-entry h3 {
            margin: 0 0 8px;
            font-size: 1rem;
        }

        .sanction-meta {
            color: rgba(255,255,255,.62);
            font-size: .8rem;
            line-height: 1.5;
            margin: 5px 0;
            overflow-wrap: anywhere;
        }

        .sanction-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            margin-bottom: 5px;
            font-size: .75rem;
            background: rgba(255,255,255,.08);
        }

        .sanction-status.active {
            color: #fda4af;
            background: rgba(225,29,72,.14);
        }

        .sanction-status.expired,
        .sanction-status.revoked,
        .sanction-status.completed {
            color: #86efac;
            background: rgba(22,163,74,.12);
        }

        /* Messages et compteur */
        .members-count {
            opacity: .75;
            font-size: .9rem;
        }

        .members-message {
            padding: 25px;
            text-align: center;
            border-radius: 15px;
            background: rgba(255,255,255,.05);
            margin-bottom: 20px;
        }

        .members-error {
            color: #ff9ca8;
            border: 1px solid rgba(255,70,90,.3);
        }

        .members-success {
            color: #a8ffc0;
            border: 1px solid rgba(70,255,120,.25);
        }

        [hidden] {
            display: none !important;
        }

        /* =========================================
           FENÊTRE DES ACTIONS
        ========================================= */

        .action-dialog {
            width: min(560px, calc(100% - 28px));
            max-height: 85vh;
            margin: auto;
            padding: 0;
            overflow: auto;
            color: white;
            background: #111629;
            border: 1px solid rgba(0,217,255,.25);
            border-radius: 18px;
            box-shadow: 0 25px 80px rgba(0,0,0,.6);
        }

        .action-dialog::backdrop {
            background: rgba(0,0,0,.75);
            backdrop-filter: blur(5px);
        }

        .dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,.09);
        }

        .dialog-header h2 {
            margin: 0;
            font-size: 1.2rem;
            overflow-wrap: anywhere;
        }

        .dialog-close {
            flex-shrink: 0;
            border: 0;
            color: white;
            background: transparent;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .dialog-content {
            padding: 20px;
        }

        .dialog-content p {
            line-height: 1.6;
            color: rgba(255,255,255,.75);
            margin-bottom: 15px;
        }

        .dialog-label {
            display: block;
            margin: 14px 0 7px;
            font-size: .9rem;
            font-weight: 600;
        }

        .dialog-input,
        .dialog-select,
        .dialog-textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            color: white;
            background: #0a1020;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 10px;
            font: inherit;
        }

        .dialog-select option {
            color: white;
            background: #111629;
        }

        .dialog-textarea {
            min-height: 85px;
            resize: vertical;
        }

        .dialog-buttons {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .dialog-button.primary {
            background: #5865f2;
        }

        .dialog-button.danger {
            background: #b72b45;
        }

        .dialog-button:disabled {
            opacity: .55;
            cursor: wait;
        }

        /* Gestion des rôles */
        .role-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .role-name {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .role-status {
            display: block;
            margin-top: 4px;
            color: rgba(255,255,255,.55);
            font-size: .8rem;
        }

        .role-row button {
            flex-shrink: 0;
        }

        /* Notification */
        .members-toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 5000;
            max-width: calc(100% - 36px);
            padding: 14px 18px;
            border: 1px solid rgba(0,217,255,.3);
            border-radius: 12px;
            color: white;
            background: #111629;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
        }

        /* =========================================
           TABLETTES : LIGNES PLUS COMPACTES
        ========================================= */

        @media (max-width: 1050px) and (min-width: 851px) {
            .member-card {
                grid-template-columns:
                    minmax(160px, 1fr)
                    minmax(120px, .7fr)
                    minmax(250px, 1.5fr);
                gap: 12px;
                padding: 16px;
            }

            .member-avatar {
                width: 50px;
                height: 50px;
            }

            .member-action {
                flex-basis: 115px;
                padding: 9px;
                font-size: .8rem;
            }
        }

        /* =========================================
           MOBILE : CONTENU EMPILÉ POUR LA LISIBILITÉ
        ========================================= */

        @media (max-width: 850px) {
            .members-page {
                padding-top: 90px;
            }

            .members-section {
                width: 94%;
                padding-top: 25px;
            }

            .members-grid {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .member-card {
                grid-template-columns: minmax(0, 1fr);
                gap: 12px;
                padding: 16px;
            }

            .member-card-top,
            .member-id,
            .member-actions,
            .member-no-action {
                grid-column: 1;
                grid-row: auto;
            }

            .member-id {
                margin-top: 0;
            }

            .member-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .member-action {
                flex: 1 1 auto;
                width: 100%;
                text-align: left;
                box-sizing: border-box;
            }

            .members-toolbar {
                align-items: stretch;
            }

            .members-search {
                width: 100%;
                min-width: 0;
            }

            .members-count {
                align-self: center;
            }

            .members-button {
                text-align: center;
            }

            .role-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .role-row button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <canvas id="particles"></canvas>
    <nav class="navbar" id="navbar"></nav>

    <main class="members-page">
        <section class="members-section">

            <header class="members-header">
                <p class="members-kicker">👥 ESPACE COMMUNAUTÉ</p>
                <h1>Liste des membres</h1>
                <p>
                    Consulte les membres du serveur et effectue les
                    actions autorisées par tes permissions Discord.
                </p>
            </header>

            <div id="membersLoading" class="members-message">
                ⏳ Chargement des membres...
            </div>

            <div id="membersError"
                 class="members-message members-error"
                 hidden></div>

            <div id="membersContent" hidden>
                <div class="members-toolbar">
                    <input
                        id="membersSearch"
                        class="members-search"
                        type="search"
                        placeholder="🔎 Rechercher un membre..."
                        aria-label="Rechercher un membre">

                    <span id="membersCount" class="members-count"></span>

                    <button id="membersRefresh"
                            class="members-button"
                            type="button">
                        🔄 Actualiser
                    </button>
                </div>

                <div id="membersGrid" class="members-grid"></div>
            </div>
        </section>
    </main>

    <dialog id="actionDialog" class="action-dialog">
        <div class="dialog-header">
            <h2 id="dialogTitle">Action</h2>
            <button type="button"
                    class="dialog-close"
                    data-close
                    aria-label="Fermer">×</button>
        </div>
        <div id="dialogContent" class="dialog-content"></div>
    </dialog>

    <div id="membersToast"
         class="members-toast"
         role="status"
         hidden></div>

    <script src="js/navbar.js?v=20261015"></script>

    <script>
        const API_URL =
            "https://la-communaute-live-bot.de.deplexo.com";

        const loading = document.getElementById("membersLoading");
        const errorBox = document.getElementById("membersError");
        const content = document.getElementById("membersContent");
        const grid = document.getElementById("membersGrid");
        const searchInput = document.getElementById("membersSearch");
        const countElement = document.getElementById("membersCount");
        const dialog = document.getElementById("actionDialog");
        const dialogTitle = document.getElementById("dialogTitle");
        const dialogContent = document.getElementById("dialogContent");
        const toast = document.getElementById("membersToast");

        let permissions = [];
        let allMembers = [];
        let activeMemberId = null;
        let toastTimeout = null;

        function escapeHTML(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function hasPermission(permission) {
            return permissions.includes(permission);
        }

        function showToast(message) {
            toast.textContent = message;
            toast.hidden = false;

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.hidden = true;
            }, 4500);
        }

        function openDialog(title, html) {
            dialogTitle.textContent = title;
            dialogContent.innerHTML = html;

            if (!dialog.open) {
                dialog.showModal();
            }
        }

        function showDialogError(message) {
            openDialog(
                "Une erreur est survenue",
                `
                    <p>${escapeHTML(message)}</p>
                    <div class="dialog-buttons">
                        <button class="dialog-button primary"
                                type="button"
                                data-close>
                            Fermer
                        </button>
                    </div>
                `
            );
        }

        async function apiRequest(path, options = {}) {
            const token = localStorage.getItem("discord_session");

            if (!token) {
                throw new Error(
                    "Tu n'es pas connecté. Connecte-toi avec Discord."
                );
            }

            const headers = {
                Authorization: `Bearer ${token}`,
                ...(options.body
                    ? { "Content-Type": "application/json" }
                    : {})
            };

            const response = await fetch(`${API_URL}${path}`, {
                method: options.method || "GET",
                headers,
                ...(options.body
                    ? { body: JSON.stringify(options.body) }
                    : {})
            });

            let data = {};

            try {
                data = await response.json();
            } catch {
                // Certains messages d'erreur du serveur peuvent ne pas être JSON.
            }

            if (!response.ok) {
                throw new Error(
                    data.error || `Erreur serveur : ${response.status}`
                );
            }

            return data;
        }

        async function loadPermissions() {
            const data = await apiRequest("/auth/permissions");

            if (!data.connected || !Array.isArray(data.permissions)) {
                throw new Error(
                    "Impossible de vérifier tes permissions Discord."
                );
            }

            permissions = data.permissions;
        }

        async function loadMembers() {
            const data = await apiRequest("/members");

            const members = Array.isArray(data)
                ? data
                : data && Array.isArray(data.members)
                    ? data.members
                    : null;

            if (!members) {
                console.error("Réponse de l'API /members :", data);
                throw new Error(
                    "Le serveur a renvoyé un format de membres incorrect."
                );
            }

            return members;
        }

        function getMemberRole(member) {
            if (Array.isArray(member.roles) && member.roles.length) {
                return member.roles
                    .map(role =>
                        typeof role === "string" ? role : role.name
                    )
                    .filter(Boolean)
                    .join(" • ");
            }

            return member.role || "Membre";
        }

        function getActions(member) {
            const actions = [];

            if (hasPermission("temp_ban")) {
                actions.push(`
                    <button class="member-action"
                            data-action="temp-ban"
                            data-id="${escapeHTML(member.id)}">
                        ⏱️ Ban temporaire
                    </button>
                `);
            }

            if (hasPermission("perm_ban")) {
                actions.push(`
                    <button class="member-action danger"
                            data-action="perm-ban"
                            data-id="${escapeHTML(member.id)}">
                        🔨 Ban définitif
                    </button>
                `);
            }

            if (hasPermission("manage_roles")) {
                actions.push(`
                    <button class="member-action"
                            data-action="roles"
                            data-id="${escapeHTML(member.id)}">
                        🛡️ Gérer les rôles
                    </button>
                `);
            }

            if (hasPermission("temp_ban") || hasPermission("perm_ban")) {
                actions.push(`
                    <button class="member-action"
                            data-action="mute"
                            data-id="${escapeHTML(member.id)}">
                        🔇 Mute vocal / chat
                    </button>
                `);
            }

            if (
                hasPermission("sanctions_total") ||
                hasPermission("temp_ban") ||
                hasPermission("perm_ban")
            ) {
                actions.push(`
                    <button class="member-action"
                            data-action="sanctions"
                            data-id="${escapeHTML(member.id)}">
                        📋 Historique des sanctions
                    </button>
                `);
            }

            if (!actions.length) {
                return `
                    <span class="member-no-action">
                        Aucune action disponible
                    </span>
                `;
            }

            return `
                <div class="member-actions">
                    ${actions.join("")}
                </div>
            `;
        }

        function renderMembers() {
            const query = searchInput.value.trim().toLowerCase();

            const filtered = allMembers.filter(member => {
                const name =
                    member.displayName ||
                    member.globalName ||
                    member.username ||
                    "Membre";

                return (
                    String(name).toLowerCase().includes(query) ||
                    String(member.username || "").toLowerCase().includes(query) ||
                    String(member.id || "").includes(query)
                );
            });

            countElement.textContent =
                `${filtered.length} membre${filtered.length > 1 ? "s" : ""}`;

            if (!filtered.length) {
                grid.innerHTML = `
                    <div class="members-message">
                        👥 Aucun membre ne correspond à ta recherche.
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(member => {
                const name = escapeHTML(
                    member.displayName ||
                    member.globalName ||
                    member.username ||
                    "Membre"
                );

                const role = escapeHTML(getMemberRole(member));

                const avatar = escapeHTML(
                    member.avatar ||
                    "https://cdn.discordapp.com/embed/avatars/0.png"
                );

                const id = escapeHTML(member.id || "");

                return `
                    <article class="member-card">
                        <div class="member-card-top">
                            <img
                                src="${avatar}"
                                alt=""
                                class="member-avatar"
                                loading="lazy"
                                onerror="this.onerror=null;this.src='https://cdn.discordapp.com/embed/avatars/0.png';">

                            <div class="member-identity">
                                <h2>${name}</h2>
                                <span>${role}</span>
                            </div>
                        </div>

                        <div class="member-id">ID : ${id}</div>

                        ${getActions(member)}
                    </article>
                `;
            }).join("");
        }

        function getMemberName(memberId) {
            const member = allMembers.find(item => item.id === memberId);

            return member
                ? member.displayName ||
                  member.globalName ||
                  member.username ||
                  memberId
                : memberId;
        }

        function openMuteDialog(memberId) {
            activeMemberId = memberId;
            const name = escapeHTML(getMemberName(memberId));

            openDialog(
                `🔇 Sanction — ${name}`,
                `
                    <p>
                        Choisis le type de mute, sa durée et une raison.
                        Le mute vocal empêche de parler mais laisse entendre
                        les autres. Le mute chat bloque l'envoi de messages
                        dans les salons textuels.
                    </p>

                    <form id="muteForm">
                        <label class="dialog-label" for="muteMode">
                            Type de sanction
                        </label>

                        <select class="dialog-select"
                                id="muteMode"
                                name="mode"
                                required>
                            <option value="voice">
                                🔇 Mute vocal — peut toujours entendre
                            </option>
                            <option value="chat">
                                💬 Mute chat — peut toujours lire
                            </option>
                            <option value="both">
                                🔇💬 Mute vocal + chat
                            </option>
                        </select>

                        <label class="dialog-label" for="muteDuration">
                            Durée
                        </label>

                        <select class="dialog-select"
                                id="muteDuration"
                                name="durationMinutes"
                                required>
                            <option value="5">5 minutes</option>
                            <option value="10">10 minutes</option>
                            <option value="30">30 minutes</option>
                            <option value="60">1 heure</option>
                            <option value="360">6 heures</option>
                            <option value="720">12 heures</option>
                            <option value="1440">24 heures</option>
                            <option value="4320">3 jours</option>
                            <option value="10080">7 jours</option>
                        </select>

                        <label class="dialog-label" for="muteReason">
                            Raison
                        </label>

                        <textarea
                            class="dialog-textarea"
                            id="muteReason"
                            name="reason"
                            maxlength="450"
                            minlength="3"
                            placeholder="Explique la raison de la sanction"
                            required></textarea>

                        <div class="dialog-buttons">
                            <button class="dialog-button"
                                    type="button"
                                    data-close>
                                Annuler
                            </button>

                            <button class="dialog-button danger"
                                    type="submit">
                                Appliquer la sanction
                            </button>
                        </div>
                    </form>
                `
            );
        }

        function displayDate(value) {
            if (!value) return "—";

            const date = new Date(value);

            return Number.isNaN(date.getTime())
                ? "—"
                : date.toLocaleString("fr-FR");
        }

        function sanctionTypeLabel(sanction) {
            if (sanction.type === "mute") {
                return sanction.mode === "voice"
                    ? "Mute vocal"
                    : sanction.mode === "chat"
                        ? "Mute chat"
                        : "Mute vocal + chat";
            }

            if (sanction.type === "ban_temp") return "Ban temporaire";
            if (sanction.type === "ban_perm") return "Ban définitif";
            if (sanction.type === "kick") return "Expulsion";

            return sanction.type || "Sanction";
        }

        function sanctionStatusLabel(status) {
            const labels = {
                active: "Active",
                expired: "Expirée",
                revoked: "Levée manuellement",
                completed: "Effectuée",
                superseded: "Remplacée",
                failed: "Échec",
                pending: "En cours"
            };

            return labels[status] || status || "Inconnue";
        }

        async function openSanctionsHistory(memberId) {
            activeMemberId = memberId;

            const name = getMemberName(memberId);

            openDialog(
                `📋 Sanctions — ${name}`,
                "<p>Chargement de l’historique…</p>"
            );

            try {
                const data = await apiRequest(
                    `/moderation/sanctions?memberId=${encodeURIComponent(memberId)}`
                );

                const sanctions = Array.isArray(data.sanctions)
                    ? data.sanctions
                    : [];

                if (!sanctions.length) {
                    dialogContent.innerHTML = `
                        <p>
                            Aucune sanction enregistrée pour
                            <strong>${escapeHTML(name)}</strong>.
                        </p>

                        <div class="dialog-buttons">
                            <button class="dialog-button"
                                    type="button"
                                    data-close>
                                Fermer
                            </button>
                        </div>
                    `;
                    return;
                }

                dialogContent.innerHTML = `
                    <p>
                        Historique des sanctions enregistrées pour
                        <strong>${escapeHTML(name)}</strong>.
                    </p>

                    <div>
                        ${sanctions.map(sanction => {
                            const activeMute =
                                sanction.type === "mute" &&
                                sanction.status === "active";

                            const duration = sanction.durationMinutes
                                ? `Durée : ${escapeHTML(formatDuration(sanction.durationMinutes))}`
                                : "Durée : permanente / non définie";

                            return `
                                <article class="sanction-entry">
                                    <span class="sanction-status ${escapeHTML(sanction.status)}">
                                        ${escapeHTML(sanctionStatusLabel(sanction.status))}
                                    </span>

                                    <h3>
                                        ${escapeHTML(sanctionTypeLabel(sanction))}
                                    </h3>

                                    <div class="sanction-meta">
                                        📅 Date :
                                        ${escapeHTML(displayDate(sanction.createdAt))}
                                    </div>

                                    <div class="sanction-meta">
                                        ⏳ ${duration}
                                    </div>

                                    ${sanction.expiresAt
                                        ? `<div class="sanction-meta">Fin prévue : ${escapeHTML(displayDate(sanction.expiresAt))}</div>`
                                        : ""}

                                    <div class="sanction-meta">
                                        👮 Modérateur :
                                        ${escapeHTML(sanction.moderatorName || "Inconnu")}
                                    </div>

                                    <div class="sanction-meta">
                                        📝 Raison :
                                        ${escapeHTML(sanction.reason || "Aucune raison renseignée")}
                                    </div>

                                    ${activeMute
                                        ? `<button class="dialog-button danger" type="button" data-revoke-sanction="${escapeHTML(sanction.id)}">Lever cette sanction</button>`
                                        : ""}
                                </article>
                            `;
                        }).join("")}
                    </div>

                    <div class="dialog-buttons">
                        <button class="dialog-button"
                                type="button"
                                data-close>
                            Fermer
                        </button>
                    </div>
                `;
            } catch (error) {
                showDialogError(error.message);
            }
        }

        function formatDuration(minutes) {
            if (minutes < 60) return `${minutes} minute(s)`;
            if (minutes % 1440 === 0) {
                return `${minutes / 1440} jour(s)`;
            }
            if (minutes % 60 === 0) {
                return `${minutes / 60} heure(s)`;
            }

            return `${minutes} minute(s)`;
        }

        async function revokeSanction(sanctionId, button) {
            button.disabled = true;

            try {
                const data = await apiRequest(
                    `/moderation/sanctions/${encodeURIComponent(sanctionId)}/revoke`,
                    {
                        method: "POST",
                        body: {}
                    }
                );

                showToast(`✅ ${data.message || "Sanction levée."}`);

                await openSanctionsHistory(activeMemberId);
                await initMembers();
            } catch (error) {
                showDialogError(error.message);
            } finally {
                if (button.isConnected) {
                    button.disabled = false;
                }
            }
        }

        function openTempBan(memberId) {
            activeMemberId = memberId;

            openDialog(
                "⏱️ Ban temporaire",
                `
                    <p>
                        Le membre sera banni pendant la durée choisie.
                        Le débannissement automatique de cette version
                        dépend du fonctionnement continu du bot.
                    </p>

                    <form id="tempBanForm">
                        <label class="dialog-label" for="banDuration">
                            Durée du bannissement
                        </label>

                        <select class="dialog-select"
                                id="banDuration"
                                name="durationMinutes"
                                required>
                            <option value="10">10 minutes</option>
                            <option value="60">1 heure</option>
                            <option value="360">6 heures</option>
                            <option value="1440">24 heures</option>
                            <option value="4320">3 jours</option>
                            <option value="10080">7 jours</option>
                        </select>

                        <label class="dialog-label" for="tempBanReason">
                            Raison
                        </label>

                        <textarea
                            class="dialog-textarea"
                            id="tempBanReason"
                            name="reason"
                            maxlength="450"
                            placeholder="Raison du bannissement"
                            required></textarea>

                        <div class="dialog-buttons">
                            <button class="dialog-button"
                                    type="button"
                                    data-close>
                                Annuler
                            </button>

                            <button class="dialog-button danger"
                                    type="submit">
                                Confirmer le ban
                            </button>
                        </div>
                    </form>
                `
            );
        }

        function openPermanentBan(memberId) {
            activeMemberId = memberId;

            const member = allMembers.find(
                item => item.id === memberId
            );

            const name = member
                ? member.displayName ||
                  member.globalName ||
                  member.username
                : memberId;

            openDialog(
                "🔨 Ban définitif",
                `
                    <p>
                        Tu es sur le point de bannir définitivement
                        <strong>${escapeHTML(name)}</strong>.
                        Cette action empêche le membre de rejoindre
                        le serveur jusqu'à un débannissement.
                    </p>

                    <form id="permBanForm">
                        <label class="dialog-label" for="permBanReason">
                            Raison du bannissement
                        </label>

                        <textarea
                            class="dialog-textarea"
                            id="permBanReason"
                            name="reason"
                            maxlength="450"
                            placeholder="Indique la raison"
                            required></textarea>

                        <div class="dialog-buttons">
                            <button class="dialog-button"
                                    type="button"
                                    data-close>
                                Annuler
                            </button>

                            <button class="dialog-button danger"
                                    type="submit">
                                Confirmer le bannissement
                            </button>
                        </div>
                    </form>
                `
            );
        }

        async function openRoleManager(memberId) {
            activeMemberId = memberId;

            openDialog(
                "🛡️ Gestion des rôles",
                "<p>Chargement des rôles Discord...</p>"
            );

            try {
                const data = await apiRequest(
                    `/moderation/roles?memberId=${encodeURIComponent(memberId)}`
                );

                const roles = Array.isArray(data.roles)
                    ? data.roles
                    : [];

                let rows = "";

                if (!roles.length) {
                    rows = `
                        <p>
                            Aucun rôle modifiable n'est disponible pour toi
                            sur ce membre. Les rôles protégés ou supérieurs
                            à ceux que tu peux gérer ne sont pas affichés.
                        </p>
                    `;
                } else {
                    rows = roles.map(role => {
                        const action = role.assigned ? "remove" : "add";

                        const label = role.assigned
                            ? "➖ Retirer"
                            : "➕ Ajouter";

                        return `
                            <div class="role-row">
                                <div class="role-name">
                                    <strong>
                                        ${escapeHTML(role.name)}
                                    </strong>

                                    <span class="role-status">
                                        ${role.assigned
                                            ? "Rôle attribué"
                                            : "Rôle non attribué"}
                                    </span>
                                </div>

                                <button
                                    class="dialog-button role-toggle"
                                    type="button"
                                    data-role-id="${escapeHTML(role.id)}"
                                    data-role-action="${action}">
                                    ${label}
                                </button>
                            </div>
                        `;
                    }).join("");
                }

                dialogTitle.textContent =
                    `🛡️ Rôles — ${data.memberName || memberId}`;

                dialogContent.innerHTML = `
                    <p>
                        Sélectionne une action. Discord et le bot
                        vérifieront les permissions avant modification.
                    </p>

                    <div>${rows}</div>

                    <div class="dialog-buttons">
                        <button class="dialog-button"
                                type="button"
                                data-close>
                            Fermer
                        </button>
                    </div>
                `;
            } catch (error) {
                showDialogError(error.message);
            }
        }

        async function handleFormSubmit(event) {
            const form = event.target;

            if (
                form.id !== "tempBanForm" &&
                form.id !== "permBanForm" &&
                form.id !== "muteForm"
            ) {
                return;
            }

            event.preventDefault();

            const submitButton = form.querySelector(
                'button[type="submit"]'
            );

            submitButton.disabled = true;

            try {
                let data;

                if (form.id === "tempBanForm") {
                    data = await apiRequest(
                        "/moderation/temp-ban",
                        {
                            method: "POST",
                            body: {
                                memberId: activeMemberId,
                                durationMinutes: Number(
                                    form.elements.durationMinutes.value
                                ),
                                reason: form.elements.reason.value.trim()
                            }
                        }
                    );
                } else if (form.id === "permBanForm") {
                    data = await apiRequest(
                        "/moderation/perm-ban",
                        {
                            method: "POST",
                            body: {
                                memberId: activeMemberId,
                                reason: form.elements.reason.value.trim()
                            }
                        }
                    );
                } else {
                    data = await apiRequest(
                        "/moderation/mute",
                        {
                            method: "POST",
                            body: {
                                memberId: activeMemberId,
                                mode: form.elements.mode.value,
                                durationMinutes: Number(
                                    form.elements.durationMinutes.value
                                ),
                                reason: form.elements.reason.value.trim()
                            }
                        }
                    );
                }

                dialog.close();
                showToast(`✅ ${data.message || "Action effectuée."}`);

                await initMembers();
            } catch (error) {
                showDialogError(error.message);
            } finally {
                if (submitButton.isConnected) {
                    submitButton.disabled = false;
                }
            }
        }

        async function handleRoleToggle(button) {
            const roleId = button.dataset.roleId;
            const action = button.dataset.roleAction;
            const memberId = activeMemberId;

            button.disabled = true;

            try {
                const data = await apiRequest(
                    "/moderation/roles",
                    {
                        method: "POST",
                        body: {
                            memberId,
                            roleId,
                            action
                        }
                    }
                );

                showToast(`✅ ${data.message || "Rôle modifié."}`);

                await openRoleManager(memberId);
                await initMembers();
            } catch (error) {
                showDialogError(error.message);
            } finally {
                if (button.isConnected) {
                    button.disabled = false;
                }
            }
        }

        grid.addEventListener("click", event => {
            const button = event.target.closest(".member-action");

            if (!button) return;

            const memberId = button.dataset.id;
            const action = button.dataset.action;

            if (action === "temp-ban") {
                openTempBan(memberId);
            } else if (action === "perm-ban") {
                openPermanentBan(memberId);
            } else if (action === "roles") {
                openRoleManager(memberId);
            } else if (action === "mute") {
                openMuteDialog(memberId);
            } else if (action === "sanctions") {
                openSanctionsHistory(memberId);
            }
        });

        dialog.addEventListener("click", event => {
            if (event.target.closest("[data-close]")) {
                dialog.close();
                return;
            }

            const roleButton = event.target.closest(".role-toggle");

            if (roleButton) {
                handleRoleToggle(roleButton);
                return;
            }

            const revokeButton = event.target.closest(
                "[data-revoke-sanction]"
            );

            if (revokeButton) {
                revokeSanction(
                    revokeButton.dataset.revokeSanction,
                    revokeButton
                );
            }
        });

        dialog.addEventListener("submit", handleFormSubmit);

        searchInput.addEventListener("input", renderMembers);

        document.getElementById("membersRefresh")
            .addEventListener("click", initMembers);

        async function initMembers() {
            loading.hidden = false;
            errorBox.hidden = true;
            content.hidden = true;
            grid.innerHTML = "";

            try {
                await loadPermissions();

                allMembers = await loadMembers();

                renderMembers();

                content.hidden = false;
            } catch (error) {
                console.error(
                    "Erreur chargement des membres :",
                    error
                );

                errorBox.textContent = `❌ ${error.message}`;
                errorBox.hidden = false;
            } finally {
                loading.hidden = true;
            }
        }

        initMembers();
    </script>
</body>
</html>
