<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Membres — La communauté live</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(88,101,242,.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(0,217,255,.08),
                    transparent 35%
                ),
                #080b14;

            color: #f8fafc;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        .page {

            width:
                min(1500px, 94%);

            margin:
                0 auto;

            padding:
                120px 0 60px;

        }


        /* ==================================================
           EN-TÊTE
        ================================================== */

        .page-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

            margin-bottom:
                25px;

        }


        .page-title h1 {

            margin:
                0 0 7px;

            font-size:
                clamp(2rem, 4vw, 2.8rem);

        }


        .page-title p {

            margin:
                0;

            color:
                #94a3b8;

        }


        .back-button {

            padding:
                11px 17px;

            border-radius:
                12px;

            background:
                rgba(88,101,242,.15);

            border:
                1px solid
                rgba(88,101,242,.30);

            color:
                #c7d2fe;

            text-decoration:
                none;

            transition:
                .2s;

            white-space:
                nowrap;

        }


        .back-button:hover {

            background:
                rgba(88,101,242,.28);

            transform:
                translateY(-2px);

        }


        /* ==================================================
           BARRE DE RECHERCHE
        ================================================== */

        .toolbar {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            margin-bottom:
                15px;

        }


        #search {

            flex:
                1;

            min-width:
                200px;

            padding:
                14px 17px;

            border-radius:
                13px;

            border:
                1px solid
                rgba(255,255,255,.08);

            background:
                rgba(15,23,42,.85);

            color:
                white;

            outline:
                none;

            font-size:
                .95rem;

        }


        #search:focus {

            border-color:
                rgba(96,165,250,.55);

        }


        .member-count {

            padding:
                13px 17px;

            border-radius:
                13px;

            background:
                rgba(15,23,42,.85);

            border:
                1px solid
                rgba(255,255,255,.08);

            color:
                #94a3b8;

            white-space:
                nowrap;

        }


        /* ==================================================
           LISTE
        ================================================== */

        .members-list {

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

        }


        .member-row {

            display:
                grid;

            grid-template-columns:
                45px
                minmax(180px, 1fr)
                minmax(160px, 1fr)
                minmax(160px, 1fr)
                minmax(420px, auto);

            align-items:
                center;

            gap:
                14px;

            min-height:
                76px;

            padding:
                10px 14px;

            border-radius:
                14px;

            background:
                rgba(15,23,42,.72);

            border:
                1px solid
                rgba(255,255,255,.06);

            transition:
                .18s ease;

        }


        .member-row:hover {

            background:
                rgba(20,30,52,.95);

            border-color:
                rgba(96,165,250,.25);

        }


        /* ==================================================
           AVATAR
        ================================================== */

        .member-avatar {

            width:
                45px;

            height:
                45px;

            border-radius:
                50%;

            object-fit:
                cover;

            background:
                #1e293b;

        }


        /* ==================================================
           IDENTITÉ
        ================================================== */

        .member-name {

            min-width:
                0;

        }


        .display-name {

            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .username {

            margin-top:
                3px;

            color:
                #64748b;

            font-size:
                .78rem;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        /* ==================================================
           RÔLES
        ================================================== */

        .member-roles {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                5px;

        }


        .role {

            display:
                inline-flex;

            align-items:
                center;

            padding:
                5px 8px;

            border-radius:
                999px;

            background:
                rgba(88,101,242,.14);

            border:
                1px solid
                rgba(88,101,242,.22);

            color:
                #c7d2fe;

            font-size:
                .72rem;

            white-space:
                nowrap;

        }


        .role-everyone {

            color:
                #94a3b8;

            background:
                rgba(148,163,184,.08);

            border-color:
                rgba(148,163,184,.15);

        }


        .bot {

            margin-left:
                5px;

            padding:
                3px 6px;

            border-radius:
                6px;

            background:
                rgba(34,197,94,.13);

            color:
                #86efac;

            font-size:
                .65rem;

        }


        /* ==================================================
           ACTIONS
        ================================================== */

        .member-actions {

            display:
                flex;

            justify-content:
                flex-end;

            align-items:
                center;

            flex-wrap:
                wrap;

            gap:
                6px;

        }


        .action-button {

            border:
                1px solid
                rgba(255,255,255,.09);

            border-radius:
                8px;

            padding:
                7px 9px;

            background:
                rgba(30,41,59,.75);

            color:
                #e2e8f0;

            cursor:
                pointer;

            font-size:
                .73rem;

            transition:
                .18s;

            white-space:
                nowrap;

        }


        .action-button:hover {

            transform:
                translateY(-1px);

            background:
                rgba(51,65,85,.95);

        }


        .action-temp {

            border-color:
                rgba(251,191,36,.25);

            color:
                #fcd34d;

        }


        .action-perm {

            border-color:
                rgba(248,113,113,.25);

            color:
                #fca5a5;

        }


        .action-role {

            border-color:
                rgba(167,139,250,.25);

            color:
                #c4b5fd;

        }


        .action-sanction {

            border-color:
                rgba(251,146,60,.25);

            color:
                #fdba74;

        }


        .action-card {

            border-color:
                rgba(96,165,250,.25);

            color:
                #93c5fd;

        }


        /* ==================================================
           MESSAGE
        ================================================== */

        .message {

            padding:
                30px;

            text-align:
                center;

            border-radius:
                15px;

            background:
                rgba(15,23,42,.8);

            border:
                1px solid
                rgba(255,255,255,.07);

            color:
                #94a3b8;

        }


        .message.error {

            color:
                #fca5a5;

            border-color:
                rgba(248,113,113,.25);

        }


        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (max-width:1100px) {

            .member-row {

                grid-template-columns:
                    45px
                    minmax(170px, 1fr)
                    minmax(140px, 1fr)
                    minmax(280px, auto);

            }

            .member-roles {

                display:
                    none;

            }

        }


        @media (max-width:800px) {

            .page {

                padding-top:
                    100px;

            }


            .page-header {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .back-button {

                text-align:
                    center;

            }


            .toolbar {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .member-count {

                text-align:
                    center;

            }


            .member-row {

                grid-template-columns:
                    42px
                    1fr;

                padding:
                    12px;

            }


            .member-avatar {

                width:
                    42px;

                height:
                    42px;

            }


            .member-name {

                grid-column:
                    2;

            }


            .member-roles {

                display:
                    flex;

                grid-column:
                    2;

            }


            .member-actions {

                grid-column:
                    1 / -1;

                justify-content:
                    flex-start;

                padding-top:
                    5px;

                border-top:
                    1px solid
                    rgba(255,255,255,.05);

            }


            .action-button {

                flex:
                    1;

                min-width:
                    130px;

            }

        }

    </style>

</head>


<body>


<nav
    class="navbar"
    id="navbar"
></nav>


<main class="page">


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="page-header">


        <div class="page-title">

            <h1>
                👥 Membres
            </h1>

            <p>
                Gestion des membres de La communauté live
            </p>

        </div>


        <a
            href="dashboard.html"
            class="back-button"
        >
            ← Retour au dashboard
        </a>


    </header>


    <!-- ==================================================
         RECHERCHE
    ================================================== -->

    <div class="toolbar">


        <input
            id="search"
            type="search"
            placeholder="🔎 Rechercher un pseudo, un rôle..."
            autocomplete="off"
        >


        <div
            id="memberCount"
            class="member-count"
        >
            Chargement...
        </div>


    </div>


    <!-- ==================================================
         LISTE
    ================================================== -->

    <section
        id="membersList"
        class="members-list"
    >


        <div class="message">

            🔄 Chargement des membres...

        </div>


    </section>


</main>


<script src="js/navbar.js"></script>


<script>


/* ======================================================
   CONFIGURATION
====================================================== */

const API_URL =
    "https://la-communaute-live-bot.de.deplexo.com";


let allMembers = [];

let myPermissions = [];


/* ======================================================
   ÉLÉMENTS
====================================================== */

const membersList =
    document.getElementById(
        "membersList"
    );


const searchInput =
    document.getElementById(
        "search"
    );


const memberCount =
    document.getElementById(
        "memberCount"
    );


/* ======================================================
   SÉCURITÉ HTML
====================================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ======================================================
   AVATAR
====================================================== */

function getDefaultAvatar() {

    return (
        "https://cdn.discordapp.com/" +
        "embed/avatars/0.png"
    );

}


/* ======================================================
   VÉRIFICATION PERMISSION
====================================================== */

function hasPermission(
    permission
) {

    return myPermissions.includes(
        permission
    );

}


/* ======================================================
   ACTIONS DISPONIBLES
====================================================== */

function createActions(
    member
) {

    const actions = [];


    /*
       BAN TEMPORAIRE
    */

    if (
        hasPermission(
            "temp_ban"
        )
    ) {

        actions.push(`

            <button

                class="
                    action-button
                    action-temp
                "

                data-action="temp-ban"

                data-member-id="${escapeHTML(
                    member.id
                )}"

            >

                ⏳ Ban temporaire

            </button>

        `);

    }


    /*
       BAN DÉFINITIF
    */

    if (
        hasPermission(
            "perm_ban"
        )
    ) {

        actions.push(`

            <button

                class="
                    action-button
                    action-perm
                "

                data-action="perm-ban"

                data-member-id="${escapeHTML(
                    member.id
                )}"

            >

                🔨 Ban définitif

            </button>

        `);

    }


    /*
       AJOUTER / RETIRER UN RÔLE
    */

    if (
        hasPermission(
            "manage_roles"
        )
    ) {

        actions.push(`

            <button

                class="
                    action-button
                    action-role
                "

                data-action="manage-role"

                data-member-id="${escapeHTML(
                    member.id
                )}"

            >

                🎭 Rôles

            </button>

        `);

    }


    /*
       SANCTIONS
    */

    if (
        hasPermission(
            "sanctions_total"
        )
    ) {

        actions.push(`

            <button

                class="
                    action-button
                    action-sanction
                "

                data-action="sanctions"

                data-member-id="${escapeHTML(
                    member.id
                )}"

            >

                📋 Sanctions

            </button>

        `);

    }


    /*
       CARTE
    */

    if (
        hasPermission(
            "own_card"
        )
    ) {

        actions.push(`

            <button

                class="
                    action-button
                    action-card
                "

                data-action="card"

                data-member-id="${escapeHTML(
                    member.id
                )}"

            >

                🪪 Carte

            </button>

        `);

    }


    if (!actions.length) {

        return `

            <span
                style="
                    color:#64748b;
                    font-size:.75rem;
                "
            >

                Aucune action disponible

            </span>

        `;

    }


    return actions.join("");

}


/* ======================================================
   AFFICHER LES MEMBRES
====================================================== */

function renderMembers(
    members
) {

    memberCount.textContent =
        `${members.length} membre(s)`;


    if (!members.length) {

        membersList.innerHTML = `

            <div class="message">

                🔎 Aucun membre trouvé.

            </div>

        `;

        return;

    }


    membersList.innerHTML =

        members

            .map(
                member => {


                    const roles =
                        member.roles || [];


                    const rolesHTML =

                        roles.length

                            ?

                            roles

                                .map(
                                    role => `

                                        <span
                                            class="role"
                                        >

                                            ${escapeHTML(
                                                role.name
                                            )}

                                        </span>

                                    `
                                )

                                .join("")

                            :

                            `

                                <span
                                    class="
                                        role
                                        role-everyone
                                    "
                                >

                                    @everyone

                                </span>

                            `;


                    return `

                        <article
                            class="member-row"
                        >


                            <!-- AVATAR -->

                            <img

                                class="member-avatar"

                                src="${escapeHTML(
                                    member.avatar ||
                                    getDefaultAvatar()
                                )}"

                                alt="Avatar"

                                loading="lazy"

                            >


                            <!-- IDENTITÉ -->

                            <div
                                class="member-name"
                            >


                                <div
                                    class="display-name"
                                >

                                    ${escapeHTML(
                                        member.displayName
                                    )}

                                    ${
                                        member.bot
                                            ?

                                            `
                                                <span
                                                    class="bot"
                                                >
                                                    BOT
                                                </span>
                                            `

                                            :

                                            ""
                                    }

                                </div>


                                <div
                                    class="username"
                                >

                                    @${escapeHTML(
                                        member.username
                                    )}

                                </div>


                            </div>


                            <!-- RÔLES -->

                            <div
                                class="member-roles"
                            >

                                ${rolesHTML}

                            </div>


                            <!-- ACTIONS -->

                            <div
                                class="member-actions"
                            >

                                ${createActions(
                                    member
                                )}

                            </div>


                        </article>

                    `;

                }
            )

            .join("");

}


/* ======================================================
   CHARGEMENT DES MEMBRES
====================================================== */

async function loadMembers() {


    const token =
        localStorage.getItem(
            "discord_session"
        );


    if (!token) {

        membersList.innerHTML = `

            <div
                class="
                    message
                    error
                "
            >

                ❌ Tu dois être connecté avec Discord.

            </div>

        `;

        return;

    }


    try {


        /*
           On récupère d'abord
           les permissions de l'utilisateur connecté.
        */

        const permissionsResponse =
            await fetch(

                `${API_URL}/auth/permissions`,

                {

                    headers: {

                        Authorization:
                            `Bearer ${token}`

                    }

                }

            );


        const permissionsData =
            await permissionsResponse.json();


        if (
            !permissionsResponse.ok
        ) {

            throw new Error(

                permissionsData.error ||

                "Impossible de récupérer tes permissions."

            );

        }


        myPermissions =
            permissionsData.permissions || [];


        /*
           Ensuite on récupère
           les membres.
        */

        const membersResponse =
            await fetch(

                `${API_URL}/members`,

                {

                    headers: {

                        Authorization:
                            `Bearer ${token}`

                    }

                }

            );


        const membersData =
            await membersResponse.json();


        if (
            !membersResponse.ok
        ) {

            throw new Error(

                membersData.error ||

                "Impossible de récupérer les membres."

            );

        }


        allMembers =
            membersData.members || [];


        renderMembers(
            allMembers
        );


    } catch (error) {


        console.error(
            error
        );


        membersList.innerHTML = `

            <div
                class="
                    message
                    error
                "
            >

                ❌ ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* ======================================================
   RECHERCHE
====================================================== */

searchInput.addEventListener(

    "input",

    () => {


        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        if (!query) {

            renderMembers(
                allMembers
            );

            return;

        }


        const filtered =
            allMembers.filter(

                member => {


                    const name =
                        (
                            member.displayName ||
                            ""
                        )
                            .toLowerCase();


                    const username =
                        (
                            member.username ||
                            ""
                        )
                            .toLowerCase();


                    const roles =
                        (
                            member.roles ||
                            []
                        );


                    return (

                        name.includes(
                            query
                        )

                        ||

                        username.includes(
                            query
                        )

                        ||

                        roles.some(

                            role =>

                                role.name
                                    .toLowerCase()
                                    .includes(
                                        query
                                    )

                        )

                    );

                }

            );


        renderMembers(
            filtered
        );

    }

);


/* ======================================================
   CLICS SUR LES ACTIONS
====================================================== */

membersList.addEventListener(

    "click",

    event => {


        const button =
            event.target.closest(
                ".action-button"
            );


        if (!button) {

            return;

        }


        const action =
            button.dataset.action;


        const memberId =
            button.dataset.memberId;


        /*
           Pour l'instant,
           on prépare les actions.

           Les vraies actions Discord
           seront connectées ensuite
           au backend.
        */

        if (
            action === "temp-ban"
        ) {

            alert(
                "⏳ Ban temporaire\n\n" +
                "Membre : " +
                memberId +
                "\n\n" +
                "Action à connecter au bot."
            );

        }


        if (
            action === "perm-ban"
        ) {

            alert(
                "🔨 Ban définitif\n\n" +
                "Membre : " +
                memberId +
                "\n\n" +
                "Action à connecter au bot."
            );

        }


        if (
            action === "manage-role"
        ) {

            alert(
                "🎭 Gestion des rôles\n\n" +
                "Membre : " +
                memberId +
                "\n\n" +
                "Action à connecter au bot."
            );

        }


        if (
            action === "sanctions"
        ) {

            alert(
                "📋 Sanctions\n\n" +
                "Membre : " +
                memberId +
                "\n\n" +
                "Action à connecter au bot."
            );

        }


        if (
            action === "card"
        ) {

            alert(
                "🪪 Carte du membre\n\n" +
                "Membre : " +
                memberId +
                "\n\n" +
                "Action à connecter."
            );

        }

    }

);


/* ======================================================
   DÉMARRAGE
====================================================== */

loadMembers();

</script>


</body>

</html>
