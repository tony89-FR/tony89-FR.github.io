<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Membres — La communauté live</title>


    <!-- CSS PRINCIPAL DU SITE -->
    <link
        rel="stylesheet"
        href="css/style.css?v=20261006"
    >


    <style>

        /* =====================================================
           PAGE MEMBRES
        ===================================================== */

        .members-page {

            width:
                min(1500px, 94%);

            margin:
                0 auto;

            padding:
                115px 0 60px;

        }


        .members-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

            margin-bottom:
                25px;

        }


        .members-title h1 {

            margin:
                0 0 8px;

            color:
                #ffffff;

            font-size:
                clamp(2rem, 4vw, 2.8rem);

        }


        .members-title p {

            margin:
                0;

            color:
                #94a3b8;

        }


        .back-button {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                11px 17px;

            border-radius:
                12px;

            background:
                rgba(88,101,242,.15);

            border:
                1px solid
                rgba(88,101,242,.35);

            color:
                #c7d2fe;

            text-decoration:
                none;

        }


        .back-button:hover {

            background:
                rgba(88,101,242,.28);

        }


        /* =====================================================
           RECHERCHE
        ===================================================== */

        .members-toolbar {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            margin-bottom:
                15px;

        }


        #search {

            flex:
                1;

            min-width:
                0;

            padding:
                14px 17px;

            border-radius:
                13px;

            border:
                1px solid
                rgba(255,255,255,.08);

            background:
                rgba(15,23,42,.88);

            color:
                #ffffff;

            outline:
                none;

            font-size:
                .95rem;

        }


        #search::placeholder {

            color:
                #64748b;

        }


        .member-count {

            padding:
                13px 17px;

            border-radius:
                13px;

            background:
                rgba(15,23,42,.88);

            border:
                1px solid
                rgba(255,255,255,.08);

            color:
                #94a3b8;

            white-space:
                nowrap;

        }


        /* =====================================================
           LISTE
        ===================================================== */

        .members-list {

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

        }


        .member-row {

            display:
                grid;

            grid-template-columns:
                52px
                minmax(190px,1.2fr)
                minmax(220px,1fr)
                minmax(400px,2fr);

            align-items:
                center;

            gap:
                16px;

            min-height:
                76px;

            padding:
                12px 15px;

            border-radius:
                14px;

            background:
                rgba(15,23,42,.78);

            border:
                1px solid
                rgba(255,255,255,.06);

        }


        .member-avatar {

            width:
                48px;

            height:
                48px;

            border-radius:
                50%;

            object-fit:
                cover;

        }


        .display-name {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            color:
                #ffffff;

            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .username {

            margin-top:
                4px;

            color:
                #64748b;

            font-size:
                .78rem;

        }


        .bot {

            padding:
                3px 6px;

            border-radius:
                6px;

            background:
                rgba(34,197,94,.13);

            color:
                #86efac;

            font-size:
                .62rem;

        }


        .member-roles {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                5px;

        }


        .role {

            padding:
                5px 9px;

            border-radius:
                999px;

            background:
                rgba(88,101,242,.14);

            border:
                1px solid
                rgba(88,101,242,.22);

            color:
                #c7d2fe;

            font-size:
                .72rem;

        }


        .member-actions {

            display:
                flex;

            justify-content:
                flex-end;

            flex-wrap:
                wrap;

            gap:
                6px;

        }


        .action-button {

            padding:
                8px 10px;

            border:
                1px solid
                rgba(255,255,255,.09);

            border-radius:
                8px;

            background:
                rgba(30,41,59,.85);

            color:
                #e2e8f0;

            cursor:
                pointer;

            font-size:
                .73rem;

            font-weight:
                600;

        }


        .action-temp {
            color:#fcd34d;
        }


        .action-perm {
            color:#fca5a5;
        }


        .action-role {
            color:#c4b5fd;
        }


        .action-sanction {
            color:#fdba74;
        }


        .action-card {
            color:#93c5fd;
        }


        .message {

            padding:
                30px;

            text-align:
                center;

            border-radius:
                15px;

            background:
                rgba(15,23,42,.85);

            border:
                1px solid
                rgba(255,255,255,.07);

            color:
                #94a3b8;

        }


        .message.error {

            color:
                #fca5a5;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width:1100px) {

            .member-row {

                grid-template-columns:
                    52px
                    minmax(180px,1fr)
                    minmax(250px,1fr);

            }


            .member-actions {

                grid-column:
                    2 / -1;

                justify-content:
                    flex-start;

            }

        }


        @media (max-width:850px) {

            .members-header {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }


            .back-button {

                width:
                    100%;

            }


            .member-row {

                grid-template-columns:
                    52px
                    1fr;

            }


            .member-roles {

                grid-column:
                    1 / -1;

            }


            .member-actions {

                grid-column:
                    1 / -1;

                justify-content:
                    flex-start;

                padding-top:
                    10px;

            }

        }


        @media (max-width:600px) {

            .members-page {

                width:
                    94%;

                padding-top:
                    100px;

            }


            .members-toolbar {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .member-count {

                text-align:
                    center;

            }


            .member-row {

                grid-template-columns:
                    45px
                    1fr;

            }


            .action-button {

                flex:
                    1;

                min-width:
                    125px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
         NE RIEN METTRE À L'INTÉRIEUR
    ====================================================== -->

    <nav
        class="navbar"
        id="navbar"
    ></nav>


    <!-- =====================================================
         PAGE
    ====================================================== -->

    <main class="members-page">


        <header class="members-header">


            <div class="members-title">

                <h1>
                    👥 Membres
                </h1>

                <p>
                    Gestion des membres de La communauté live
                </p>

            </div>


            <a
                href="dashboard.html"
                class="back-button"
            >

                ← Retour au dashboard

            </a>


        </header>


        <div class="members-toolbar">


            <input
                id="search"
                type="search"
                placeholder="🔎 Rechercher un membre..."
                autocomplete="off"
            >


            <div
                id="memberCount"
                class="member-count"
            >

                Chargement...

            </div>


        </div>


        <section
            id="membersList"
            class="members-list"
        >

            <div class="message">

                🔄 Chargement des membres...

            </div>

        </section>


    </main>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <script src="js/navbar.js?v=20261006"></script>


    <!-- =====================================================
         MEMBRES
    ====================================================== -->

    <script>

        const API_URL =
            "https://la-communaute-live-bot.de.deplexo.com";


        let allMembers = [];

        let myPermissions = [];


        const membersList =
            document.getElementById(
                "membersList"
            );


        const searchInput =
            document.getElementById(
                "search"
            );


        const memberCount =
            document.getElementById(
                "memberCount"
            );


        function escapeHTML(value) {

            return String(value ?? "")
                .replaceAll("&","&amp;")
                .replaceAll("<","&lt;")
                .replaceAll(">","&gt;")
                .replaceAll('"',"&quot;")
                .replaceAll("'","&#039;");

        }


        function hasPermission(permission) {

            return myPermissions.includes(
                permission
            );

        }


        function getDefaultAvatar() {

            return (
                "https://cdn.discordapp.com/" +
                "embed/avatars/0.png"
            );

        }


        function createActions(member) {

            const actions = [];


            if (
                hasPermission("temp_ban")
            ) {

                actions.push(`

                    <button
                        class="action-button action-temp"
                        data-action="temp-ban"
                        data-member-id="${escapeHTML(member.id)}"
                    >

                        ⏳ Ban temporaire

                    </button>

                `);

            }


            if (
                hasPermission("perm_ban")
            ) {

                actions.push(`

                    <button
                        class="action-button action-perm"
                        data-action="perm-ban"
                        data-member-id="${escapeHTML(member.id)}"
                    >

                        🔨 Ban définitif

                    </button>

                `);

            }


            if (
                hasPermission("manage_roles")
            ) {

                actions.push(`

                    <button
                        class="action-button action-role"
                        data-action="manage-role"
                        data-member-id="${escapeHTML(member.id)}"
                    >

                        🎭 Rôles

                    </button>

                `);

            }


            if (
                hasPermission("sanctions_total")
            ) {

                actions.push(`

                    <button
                        class="action-button action-sanction"
                        data-action="sanctions"
                        data-member-id="${escapeHTML(member.id)}"
                    >

                        📋 Sanctions

                    </button>

                `);

            }


            if (
                hasPermission("own_card")
            ) {

                actions.push(`

                    <button
                        class="action-button action-card"
                        data-action="card"
                        data-member-id="${escapeHTML(member.id)}"
                    >

                        🪪 Carte

                    </button>

                `);

            }


            return actions.length
                ? actions.join("")
                : `<span style="color:#64748b;font-size:.75rem;">
                    Aucune action disponible
                   </span>`;

        }


        function renderMembers(members) {

            memberCount.textContent =
                `${members.length} membre(s)`;


            if (!members.length) {

                membersList.innerHTML = `

                    <div class="message">

                        🔎 Aucun membre trouvé.

                    </div>

                `;

                return;

            }


            membersList.innerHTML =
                members.map(member => {


                    const roles =
                        member.roles || [];


                    const rolesHTML =
                        roles.length

                            ?

                            roles.map(
                                role => `

                                    <span class="role">

                                        ${escapeHTML(
                                            role.name
                                        )}

                                    </span>

                                `
                            ).join("")

                            :

                            `
                                <span class="role">
                                    @everyone
                                </span>
                            `;


                    return `

                        <article
                            class="member-row"
                        >

                            <img
                                class="member-avatar"
                                src="${escapeHTML(
                                    member.avatar ||
                                    getDefaultAvatar()
                                )}"
                                alt="Avatar"
                                loading="lazy"
                            >


                            <div class="member-name">

                                <div class="display-name">

                                    ${escapeHTML(
                                        member.displayName ||
                                        member.username ||
                                        "Membre"
                                    )}

                                    ${
                                        member.bot
                                            ?

                                            `<span class="bot">
                                                BOT
                                             </span>`

                                            :
                                            ""
                                    }

                                </div>


                                <div class="username">

                                    @${escapeHTML(
                                        member.username || ""
                                    )}

                                </div>

                            </div>


                            <div class="member-roles">

                                ${rolesHTML}

                            </div>


                            <div class="member-actions">

                                ${createActions(
                                    member
                                )}

                            </div>

                        </article>

                    `;

                }).join("");

        }


        async function loadMembers() {

            const token =
                localStorage.getItem(
                    "discord_session"
                );


            if (!token) {

                membersList.innerHTML = `

                    <div class="message error">

                        ❌ Tu dois être connecté avec Discord.

                    </div>

                `;

                memberCount.textContent =
                    "Non connecté";

                return;

            }


            try {


                const permissionsResponse =
                    await fetch(
                        `${API_URL}/auth/permissions`,
                        {
                            headers: {
                                Authorization:
                                    `Bearer ${token}`
                            }
                        }
                    );


                const permissionsData =
                    await permissionsResponse.json();


                if (
                    !permissionsResponse.ok
                ) {

                    throw new Error(
                        permissionsData.error ||
                        "Impossible de récupérer les permissions."
                    );

                }


                myPermissions =
                    permissionsData.permissions || [];


                const membersResponse =
                    await fetch(
                        `${API_URL}/members`,
                        {
                            headers: {
                                Authorization:
                                    `Bearer ${token}`
                            }
                        }
                    );


                const membersData =
                    await membersResponse.json();


                if (
                    !membersResponse.ok
                ) {

                    throw new Error(
                        membersData.error ||
                        "Impossible de récupérer les membres."
                    );

                }


                allMembers =
                    membersData.members || [];


                renderMembers(
                    allMembers
                );


            } catch (error) {

                console.error(
                    "Erreur membres :",
                    error
                );


                membersList.innerHTML = `

                    <div class="message error">

                        ❌ ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;


                memberCount.textContent =
                    "Erreur";

            }

        }


        searchInput.addEventListener(
            "input",
            () => {

                const query =
                    searchInput.value
                        .trim()
                        .toLowerCase();


                if (!query) {

                    renderMembers(
                        allMembers
                    );

                    return;

                }


                const filtered =
                    allMembers.filter(
                        member => {

                            const name =
                                String(
                                    member.displayName || ""
                                ).toLowerCase();


                            const username =
                                String(
                                    member.username || ""
                                ).toLowerCase();


                            const roles =
                                member.roles || [];


                            return (

                                name.includes(query)

                                ||

                                username.includes(query)

                                ||

                                roles.some(
                                    role =>
                                        String(
                                            role.name || ""
                                        )
                                        .toLowerCase()
                                        .includes(query)
                                )

                            );

                        }
                    );


                renderMembers(
                    filtered
                );

            }
        );


        membersList.addEventListener(
            "click",
            event => {

                const button =
                    event.target.closest(
                        ".action-button"
                    );


                if (!button) {
                    return;
                }


                const action =
                    button.dataset.action;


                const memberId =
                    button.dataset.memberId;


                const messages = {

                    "temp-ban":
                        "⏳ Ban temporaire",

                    "perm-ban":
                        "🔨 Ban définitif",

                    "manage-role":
                        "🎭 Gestion des rôles",

                    "sanctions":
                        "📋 Sanctions",

                    "card":
                        "🪪 Carte du membre"

                };


                alert(

                    `${messages[action] || "Action"}\n\n` +
                    `Membre : ${memberId}\n\n` +
                    `Cette action sera connectée au bot.`

                );

            }
        );


        loadMembers();

    </script>


</body>

</html>
