```html
<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Membres - La communauté live</title>

    <style>
        .members-page {
            min-height: 100vh;
            padding-top: 110px;
        }

        .members-section {
            width: min(1350px, 94%);
            margin: 0 auto;
            padding: 35px 0 80px;

        .members-header {

            margin-bottom: 35px;

        .members-header h1 {

        }

        .members-header p:last-child {

        }

        .members-toolbar {

        }

        .members-search {

            border-radius: 12px;

            outline: none;
        }

        .members-search:focus {

        }

        .members-count {

        .member-card {

        .member-avatar {

        .member-identity {
            min-width: 0;

        .member-identity h2 {
            margin: 0 0 5px;

        .member-roles {
            color: #00d9ff;

        .member-details {

        .member-id {

        .member-presence {

        .member-action,

        .member-action:hover,

        .member-action.danger:hover,

        .members-message {

        .members-error {
            color: #ff9ca8;
            border: 1px solid rgba(255,70,90,.3);
        }

        [hidden] {
            display: none !important;
        }

        /* Fenêtre des actions */
        .action-dialog {
            width: min(560px, calc(100% - 28px));
            max-height: 85vh;
            margin: auto;
            padding: 0;
            overflow: auto;
            color: white;
            background: #111629;
            border: 1px solid rgba(0,217,255,.25);
            border-radius: 18px;
            box-shadow: 0 25px 80px rgba(0,0,0,.6);
        }

        .action-dialog::backdrop {
            background: rgba(0,0,0,.75);
            backdrop-filter: blur(5px);
        }

        .dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,.09);
        }

        .dialog-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .dialog-close {
            border: 0;
            color: white;
            background: transparent;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .dialog-content {
            padding: 20px;
        }

        .dialog-content p {
            line-height: 1.6;
            color: rgba(255,255,255,.75);
            margin-bottom: 15px;
        }

        .dialog-label {
            display: block;
            margin: 14px 0 7px;
            font-size: .9rem;
            font-weight: 600;
        }

        .dialog-input,
        .dialog-select,
        .dialog-textarea {
            width: 100%;
            padding: 12px;
            color: white;
            background: #0a1020;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 10px;
            font: inherit;
        }

        .dialog-select option {
            color: white;
            background: #111629;
        }

        .dialog-textarea {
            min-height: 85px;
            resize: vertical;
        }

        .dialog-buttons {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .dialog-button.primary {
            background: #5865f2;
        }

        .dialog-button:disabled {
            opacity: .55;
            cursor: wait;
        }

        .role-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .role-name {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .role-status {
            display: block;
            margin-top: 4px;
            color: rgba(255,255,255,.55);
            font-size: .8rem;
        }

        .role-row button {
            flex-shrink: 0;
        }

        .members-toast {
            position: fixed;

            z-index: 5000;

                align-items: stretch;
            }

                flex-basis: 100%;
            }

            .role-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .role-row button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <canvas id="particles"></canvas>
    <nav class="navbar" id="navbar"></nav>

    <main class="members-page">
        <section class="members-section">

            <header class="members-header">
                <p class="members-kicker">👥 ESPACE COMMUNAUTÉ</p>
                <h1>Liste des membres</h1>
                <p>
                    Consulte les membres du serveur et effectue les
                    actions autorisées par tes permissions Discord.
                </p>
            </header>

            <div id="membersLoading" class="members-message">
                ⏳ Chargement des membres...
            </div>

            <div id="membersError"
                 class="members-message members-error"
                 hidden></div>

            <div id="membersContent" hidden>
                <div class="members-toolbar">
                    <input
                        id="membersSearch"
                        class="members-search"
                        type="search"
                        placeholder="🔎 Rechercher un membre..."
                        aria-label="Rechercher un membre">

                    <span id="membersCount" class="members-count"></span>

                    <button id="membersRefresh"
                            class="members-button"
                            type="button">
                        🔄 Actualiser
                    </button>
                </div>

                <div id="membersGrid" class="members-grid"></div>
            </div>
        </section>
    </main>

    <dialog id="actionDialog" class="action-dialog">
        <div class="dialog-header">
            <h2 id="dialogTitle">Action</h2>
            <button type="button"
                    class="dialog-close"
                    data-close
                    aria-label="Fermer">×</button>
        </div>
        <div id="dialogContent" class="dialog-content"></div>
    </dialog>

    <div id="membersToast"
         class="members-toast"
         role="status"
         hidden></div>

    <script src="js/navbar.js?v=20261011"></script>

    <script>
        const API_URL =
            "https://la-communaute-live-bot.de.deplexo.com";

        const loading = document.getElementById("membersLoading");
        const errorBox = document.getElementById("membersError");
        const content = document.getElementById("membersContent");
        const grid = document.getElementById("membersGrid");
        const searchInput = document.getElementById("membersSearch");
        const countElement = document.getElementById("membersCount");
        const dialog = document.getElementById("actionDialog");
        const dialogTitle = document.getElementById("dialogTitle");
        const dialogContent = document.getElementById("dialogContent");
        const toast = document.getElementById("membersToast");

        let permissions = [];
        let allMembers = [];
        let activeMemberId = null;
        let toastTimeout = null;

        function escapeHTML(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function hasPermission(permission) {
            return permissions.includes(permission);
        }

        function showToast(message) {
            toast.textContent = message;
            toast.hidden = false;

            clearTimeout(toastTimeout);

            toastTimeout = setTimeout(() => {
                toast.hidden = true;
            }, 4500);
        }

        function openDialog(title, html) {
            dialogTitle.textContent = title;
            dialogContent.innerHTML = html;

            if (!dialog.open) {
                dialog.showModal();
            }
        }

        function showDialogError(message) {
            openDialog(
                "Une erreur est survenue",
                `
                    <p>${escapeHTML(message)}</p>

                    <div class="dialog-buttons">
                        <button class="dialog-button primary"
                                type="button"
                                data-close>
                            Fermer
                        </button>
                    </div>
                `
            );
        }

        async function apiRequest(path, options = {}) {
            const token = localStorage.getItem("discord_session");

            if (!token) {
                throw new Error(
                    "Tu n'es pas connecté. Connecte-toi avec Discord."
                );
            }

            const headers = {
                Authorization: `Bearer ${token}`,
                ...(options.body
                    ? { "Content-Type": "application/json" }
                    : {})
            };

            const response = await fetch(`${API_URL}${path}`, {
                method: options.method || "GET",
                headers,
                ...(options.body
                    ? { body: JSON.stringify(options.body) }
                    : {})
            });

            let data = {};

            try {
                data = await response.json();
            } catch {
                // La réponse du serveur n'est pas toujours du JSON.
            }

            if (!response.ok) {
                throw new Error(
                    data.error || `Erreur serveur : ${response.status}`
                );
            }

            return data;
        }

        async function loadPermissions() {
            const data = await apiRequest("/auth/permissions");

            if (!data.connected || !Array.isArray(data.permissions)) {
                throw new Error(
                    "Impossible de vérifier tes permissions Discord."
                );
            }

            permissions = data.permissions;
        }

        async function loadMembers() {
            const data = await apiRequest("/members");

            const members = Array.isArray(data)
                ? data
                : data && Array.isArray(data.members)
                    ? data.members
                    : null;

            if (!members) {
                console.error("Réponse de l'API /members :", data);

                throw new Error(
                    "Le serveur a renvoyé un format de membres incorrect."
                );
            }

            return members;
        }

        function getMemberRole(member) {
            if (Array.isArray(member.roles) && member.roles.length) {
                return member.roles
                    .map(role =>
                        typeof role === "string" ? role : role.name
                    )
                    .filter(Boolean)
                    .join(" • ");
            }

            return member.role || "Membre";
        }

        function getPresenceInfo(status) {
            const statuses = {
                online: {
                    label: "En ligne",
                    className: "presence-online"
                },
                idle: {
                    label: "Absent",
                    className: "presence-idle"
                },
                dnd: {
                    label: "Ne pas déranger",
                    className: "presence-dnd"
                },
                offline: {
                    label: "Hors ligne",
                    className: "presence-offline"
                },
                unknown: {
                    label: "Statut inconnu",
                    className: "presence-unknown"
                }
            };

            return statuses[status] || statuses.unknown;
        }

        function getActions(member) {
            const actions = [];

            if (hasPermission("temp_ban")) {
                actions.push(`
                    <button class="member-action"
                            data-action="temp-ban"
                            data-id="${escapeHTML(member.id)}">
                        ⏱️ Ban temporaire
                    </button>
                `);
            }

            if (hasPermission("perm_ban")) {
                actions.push(`
                    <button class="member-action danger"
                            data-action="perm-ban"
                            data-id="${escapeHTML(member.id)}">
                        🔨 Ban définitif
                    </button>
                `);
            }

            if (hasPermission("kick_member")) {
                actions.push(`
                    <button class="member-action danger"
                            data-action="kick"
                            data-id="${escapeHTML(member.id)}">
                        👢 Expulser
                    </button>
                `);
            }

            if (hasPermission("manage_nicknames")) {
                actions.push(`
                    <button class="member-action"
                            data-action="nickname"
                            data-id="${escapeHTML(member.id)}">
                        ✏️ Modifier le pseudo
                    </button>
                `);
            }

            if (hasPermission("manage_roles")) {
                actions.push(`
                    <button class="member-action"
                            data-action="roles"
                            data-id="${escapeHTML(member.id)}">
                        🛡️ Gérer les rôles
                    </button>
                `);
            }

            if (!actions.length) {
                return `
                    <span class="member-no-action">
                        Aucune action disponible
                    </span>
                `;
            }

            return `
                <div class="member-actions">
                    ${actions.join("")}
                </div>
            `;
        }

        function renderMembers() {
            const query = searchInput.value.trim().toLowerCase();

            const filtered = allMembers.filter(member => {
                const name =
                    member.displayName ||
                    member.globalName ||
                    member.username ||
                    "Membre";

                return (
                    String(name).toLowerCase().includes(query) ||
                    String(member.username || "").toLowerCase().includes(query) ||
                    String(member.id || "").includes(query)
                );
            });

            countElement.textContent =
                `${filtered.length} membre${filtered.length > 1 ? "s" : ""}`;

            if (!filtered.length) {
                grid.innerHTML = `
                    <div class="members-message">
                        👥 Aucun membre ne correspond à ta recherche.
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(member => {
                const name = escapeHTML(
                    member.displayName ||
                    member.globalName ||
                    member.username ||
                    "Membre"
                );

                const role = escapeHTML(getMemberRole(member));

                const avatar = escapeHTML(
                    member.avatar ||
                    "https://cdn.discordapp.com/embed/avatars/0.png"
                );

                const id = escapeHTML(member.id || "");
                const presence = getPresenceInfo(member.status);

                return `
                    <article class="member-card">

                        <div class="member-card-top">
                            <img
                                src="${avatar}"
                                alt=""
                                class="member-avatar"
                                loading="lazy"
                                onerror="this.onerror=null;this.src='https://cdn.discordapp.com/embed/avatars/0.png';">

                            <div class="member-identity">
                                <h2>${name}</h2>
                                <div class="member-roles">${role}</div>

                                <span class="member-presence ${presence.className}">
                                    <span class="presence-dot"></span>
                                    ${presence.label}
                                </span>
                            </div>
                        </div>

                        <div class="member-details">
                            <div class="member-id">ID : ${id}</div>
                        </div>

                        ${getActions(member)}

                    </article>
                `;
            }).join("");
        }

        // ==================================================
        // FORMULAIRE BAN TEMPORAIRE
        // ==================================================

        function openTempBan(memberId) {
            activeMemberId = memberId;

            openDialog(
                "⏱️ Ban temporaire",
                `
                    <p>
                        Le membre sera banni pendant la durée choisie.
                        Le débannissement automatique dépend du fonctionnement
                        continu du bot.
                    </p>

                    <form id="tempBanForm">
                        <label class="dialog-label" for="banDuration">
                            Durée du bannissement
                        </label>

                        <select class="dialog-select"
                                id="banDuration"
                                name="durationMinutes"
                                required>
                            <option value="10">10 minutes</option>
                            <option value="60">1 heure</option>
                            <option value="360">6 heures</option>
                            <option value="1440">24 heures</option>
                            <option value="4320">3 jours</option>
                            <option value="10080">7 jours</option>
                        </select>

                        <label class="dialog-label" for="tempBanReason">
                            Raison
                        </label>

                        <textarea class="dialog-textarea"
                                  id="tempBanReason"
                                  name="reason"
                                  maxlength="450"
                                  placeholder="Raison du bannissement"
                                  required></textarea>

                        <div class="dialog-buttons">
                            <button class="dialog-button"
                                    type="button"
                                    data-close>
                                Annuler
                            </button>

                            <button class="dialog-button danger"
                                    type="submit">
                                Confirmer le ban
                            </button>
                        </div>
                    </form>
                `
            );
        }

        // ==================================================
        // FORMULAIRE BAN DÉFINITIF
        // ==================================================

        function openPermanentBan(memberId) {
            activeMemberId = memberId;

            const member = allMembers.find(
                item => item.id === memberId
            );

            const name = member
                ? member.displayName ||
                  member.globalName ||
                  member.username
                : memberId;

            openDialog(
                "🔨 Ban définitif",
                `
                    <p>
                        Tu es sur le point de bannir définitivement
                        <strong>${escapeHTML(name)}</strong>.
                        Cette action l'empêchera de rejoindre le serveur
                        jusqu'à un débannissement.
                    </p>

                    <form id="permBanForm">
                        <label class="dialog-label" for="permBanReason">
                            Raison du bannissement
                        </label>

                        <textarea class="dialog-textarea"
                                  id="permBanReason"
                                  name="reason"
                                  maxlength="450"
                                  placeholder="Indique la raison"
                                  required></textarea>

                        <div class="dialog-buttons">
                            <button class="dialog-button"
                                    type="button"
                                    data-close>
                                Annuler
                            </button>

                            <button class="dialog-button danger"
                                    type="submit">
                                Confirmer le bannissement
                            </button>
                        </div>
                    </form>
                `
            );
        }

        // ==================================================
        // FORMULAIRE EXPULSION
        // ==================================================

        function openKickDialog(memberId) {
            activeMemberId = memberId;

            const member = allMembers.find(
                item => item.id === memberId
            );

            const name = member
                ? member.displayName ||
                  member.globalName ||
                  member.username
                : memberId;

            openDialog(
                "👢 Expulser un membre",
                `
                    <p>
                        Veux-tu vraiment expulser
                        <strong>${escapeHTML(name)}</strong> ?
                        Cette action le retirera du serveur sans le bannir.
                    </p>

                    <form id="kickForm">
                        <label class="dialog-label" for="kickReason">
                            Raison de l'expulsion
                        </label>

                        <textarea class="dialog-textarea"
                                  id="kickReason"
                                  name="reason"
                                  maxlength="450"
                                  placeholder="Indique la raison"
                                  required></textarea>

                        <div class="dialog-buttons">
                            <button class="dialog-button"
                                    type="button"
                                    data-close>
                                Annuler
                            </button>

                            <button class="dialog-button danger"
                                    type="submit">
                                Confirmer l'expulsion
                            </button>
                        </div>
                    </form>
                `
            );
        }

        // ==================================================
        // FORMULAIRE MODIFICATION PSEUDO
        // ==================================================

        function openNicknameDialog(memberId) {
            activeMemberId = memberId;

            const member = allMembers.find(
                item => item.id === memberId
            );

            const name = member
                ? member.displayName ||
                  member.globalName ||
                  member.username
                : memberId;

            const nickname = member?.nickname || "";

            openDialog(
                "✏️ Modifier le pseudo",
                `
                    <p>
                        Membre : <strong>${escapeHTML(name)}</strong>
                    </p>

                    <form id="nicknameForm">
                        <label class="dialog-label" for="newNickname">
                            Nouveau pseudo
                        </label>

                        <input
                            class="dialog-input"
                            id="newNickname"
                            name="nickname"
                            maxlength="32"
                            value="${escapeHTML(nickname)}"
                            placeholder="Saisis un nouveau pseudo">

                        <p>
                            Laisse le champ vide pour réinitialiser
                            le pseudo personnalisé.
                        </p>

                        <div class="dialog-buttons">
                            <button class="dialog-button"
                                    type="button"
                                    data-close>
                                Annuler
                            </button>

                            <button class="dialog-button primary"
                                    type="submit">
                                Enregistrer
                            </button>
                        </div>
                    </form>
                `
            );
        }

        // ==================================================
        // GESTION DES RÔLES
        // ==================================================

        async function openRoleManager(memberId) {
            activeMemberId = memberId;

            openDialog(
                "🛡️ Gestion des rôles",
                "<p>Chargement des rôles Discord...</p>"
            );

            try {
                const data = await apiRequest(
                    `/moderation/roles?memberId=${encodeURIComponent(memberId)}`
                );

                const roles = Array.isArray(data.roles)
                    ? data.roles
                    : [];

                let rows = "";

                if (!roles.length) {
                    rows = `
                        <p>
                            Aucun rôle modifiable n'est disponible.
                            Les rôles protégés ne sont pas affichés.
                        </p>
                    `;
                } else {
                    rows = roles.map(role => {
                        const action = role.assigned ? "remove" : "add";
                        const label = role.assigned
                            ? "➖ Retirer"
                            : "➕ Ajouter";

                        return `
                            <div class="role-row">
                                <div class="role-name">
                                    <strong>${escapeHTML(role.name)}</strong>
                                    <span class="role-status">
                                        ${role.assigned
                                            ? "Rôle attribué"
                                            : "Rôle non attribué"}
                                    </span>
                                </div>

                                <button
                                    class="dialog-button role-toggle"
                                    type="button"
                                    data-role-id="${escapeHTML(role.id)}"
                                    data-role-action="${action}">
                                    ${label}
                                </button>
                            </div>
                        `;
                    }).join("");
                }

                dialogTitle.textContent =
                    `🛡️ Rôles — ${data.memberName || memberId}`;

                dialogContent.innerHTML = `
                    <p>
                        Sélectionne une action. Les permissions seront
                        vérifiées par le bot avant toute modification.
                    </p>

                    <div>${rows}</div>

                    <div class="dialog-buttons">
                        <button class="dialog-button"
                                type="button"
                                data-close>
                            Fermer
                        </button>
                    </div>
                `;
            } catch (error) {
                showDialogError(error.message);
            }
        }

        // ==================================================
        // ENVOI DES FORMULAIRES AU BOT
        // ==================================================

        async function handleFormSubmit(event) {
            const form = event.target;

            const acceptedForms = [
                "tempBanForm",
                "permBanForm",
                "kickForm",
                "nicknameForm"
            ];

            if (!acceptedForms.includes(form.id)) {
                return;
            }

            event.preventDefault();

            const submitButton = form.querySelector(
                'button[type="submit"]'
            );

            submitButton.disabled = true;

            try {
                let data;

                if (form.id === "tempBanForm") {
                    data = await apiRequest(
                        "/moderation/temp-ban",
                        {
                            method: "POST",
                            body: {
                                memberId: activeMemberId,
                                durationMinutes: Number(
                                    form.elements.durationMinutes.value
                                ),
                                reason: form.elements.reason.value.trim()
                            }
                        }
                    );
                } else if (form.id === "permBanForm") {
                    data = await apiRequest(
                        "/moderation/perm-ban",
                        {
                            method: "POST",
                            body: {
                                memberId: activeMemberId,
                                reason: form.elements.reason.value.trim()
                            }
                        }
                    );
                } else if (form.id === "kickForm") {
                    data = await apiRequest(
                        "/moderation/kick",
                        {
                            method: "POST",
                            body: {
                                memberId: activeMemberId,
                                reason: form.elements.reason.value.trim()
                            }
                        }
                    );
                } else if (form.id === "nicknameForm") {
                    data = await apiRequest(
                        "/moderation/nickname",
                        {
                            method: "POST",
                            body: {
                                memberId: activeMemberId,
                                nickname: form.elements.nickname.value,
                                reason: "Pseudo modifié depuis le dashboard"
                            }
                        }
                    );
                }

                dialog.close();

                showToast(
                    `✅ ${data.message || "Action effectuée."}`
                );

                await initMembers();
            } catch (error) {
                showDialogError(error.message);
            } finally {
                if (submitButton.isConnected) {
                    submitButton.disabled = false;
                }
            }
        }

        // ==================================================
        // AJOUT / RETRAIT D'UN RÔLE
        // ==================================================

        async function handleRoleToggle(button) {
            const roleId = button.dataset.roleId;
            const action = button.dataset.roleAction;
            const memberId = activeMemberId;

            button.disabled = true;

            try {
                const data = await apiRequest(
                    "/moderation/roles",
                    {
                        method: "POST",
                        body: {
                            memberId,
                            roleId,
                            action
                        }
                    }
                );

                showToast(
                    `✅ ${data.message || "Rôle modifié."}`
                );

                await openRoleManager(memberId);
                await initMembers();
            } catch (error) {
                showDialogError(error.message);
            } finally {
                if (button.isConnected) {
                    button.disabled = false;
                }
            }
        }

        // ==================================================
        // CLICS SUR LES BOUTONS
        // ==================================================

        grid.addEventListener("click", event => {
            const button = event.target.closest(".member-action");

            if (!button) {
                return;
            }

            const memberId = button.dataset.id;
            const action = button.dataset.action;

            if (action === "temp-ban") {
                openTempBan(memberId);
            } else if (action === "perm-ban") {
                openPermanentBan(memberId);
            } else if (action === "kick") {
                openKickDialog(memberId);
            } else if (action === "nickname") {
                openNicknameDialog(memberId);
            } else if (action === "roles") {
                openRoleManager(memberId);
            }
        });

        dialog.addEventListener("click", event => {
            if (event.target.closest("[data-close]")) {
                dialog.close();
                return;
            }

            const roleButton = event.target.closest(".role-toggle");

            if (roleButton) {
                handleRoleToggle(roleButton);
            }
        });

        dialog.addEventListener("submit", handleFormSubmit);

        searchInput.addEventListener("input", renderMembers);

        document.getElementById("membersRefresh")
            .addEventListener("click", initMembers);

        // ==================================================
        // INITIALISATION DE LA PAGE
        // ==================================================

        async function initMembers() {
            loading.hidden = false;
            errorBox.hidden = true;
            content.hidden = true;
            grid.innerHTML = "";

            try {
                await loadPermissions();

                allMembers = await loadMembers();

                renderMembers();

                content.hidden = false;
            } catch (error) {
                console.error(
                    "Erreur chargement des membres :",
                    error
                );

                errorBox.textContent = `❌ ${error.message}`;
                errorBox.hidden = false;
            } finally {
                loading.hidden = true;
            }
        }

        initMembers();
    </script>
</body>
</html>
