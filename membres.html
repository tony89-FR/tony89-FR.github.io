<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Membres - La communauté live
    </title>


    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- CSS PRINCIPAL -->
    <link
        rel="stylesheet"
        href="css/style.css?v=20261008"
    >

</head>


<body>


    <!-- ==========================================
         PARTICULES
    =========================================== -->

    <canvas id="particles"></canvas>


    <!-- ==========================================
         NAVBAR
    =========================================== -->

    <nav
        class="navbar"
        id="navbar"
    ></nav>


    <!-- ==========================================
         CONTENU
    =========================================== -->

    <main class="members-page">

        <section class="members-section">

            <div class="members-header">

                <p class="members-kicker">
                    👥 ESPACE COMMUNAUTÉ
                </p>

                <h1>
                    Liste des membres
                </h1>

                <p>
                    Consulte les membres du serveur
                    et les actions disponibles selon
                    tes permissions Discord.
                </p>

            </div>


            <!-- ÉTAT CHARGEMENT -->

            <div
                id="membersLoading"
                class="members-message"
            >
                ⏳ Chargement des membres...
            </div>


            <!-- ERREUR -->

            <div
                id="membersError"
                class="members-message members-error"
                hidden
            ></div>


            <!-- LISTE -->

            <div
                id="membersGrid"
                class="members-grid"
            ></div>

        </section>

    </main>


    <!-- ==========================================
         JAVASCRIPT NAVBAR
    =========================================== -->

    <script
        src="js/navbar.js?v=20261008"
    ></script>


    <!-- ==========================================
         JAVASCRIPT MEMBRES
    =========================================== -->

    <script>

        const API_URL =
            "https://la-communaute-live-bot.de.deplexo.com";


        const loading =
            document.getElementById(
                "membersLoading"
            );


        const errorBox =
            document.getElementById(
                "membersError"
            );


        const grid =
            document.getElementById(
                "membersGrid"
            );


        let permissions = [];


        /* =========================================
           UTILITAIRE
        ========================================= */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================
           PERMISSION
        ========================================= */

        function hasPermission(permission) {

            return permissions.includes(
                permission
            );

        }


        /* =========================================
           CHARGEMENT PERMISSIONS
        ========================================= */

        async function loadPermissions() {

            const token =
                localStorage.getItem(
                    "discord_session"
                );


            if (!token) {

                throw new Error(
                    "Tu dois être connecté avec Discord."
                );

            }


            const response =
                await fetch(
                    `${API_URL}/auth/permissions`,
                    {
                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Impossible de récupérer tes permissions."
                );

            }


            const data =
                await response.json();


            if (
                !data.connected ||
                !Array.isArray(
                    data.permissions
                )
            ) {

                throw new Error(
                    "Session Discord invalide."
                );

            }


            permissions =
                data.permissions;

        }


        /* =========================================
           CHARGEMENT MEMBRES
        ========================================= */

        async function loadMembers() {

            const token =
                localStorage.getItem(
                    "discord_session"
                );


            const response =
                await fetch(
                    `${API_URL}/members`,
                    {
                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        }
                    }
                );


            if (!response.ok) {

                if (response.status === 403) {

                    throw new Error(
                        "Tu n'as pas la permission de voir la liste des membres."
                    );

                }

                if (response.status === 404) {

                    throw new Error(
                        "La route /members n'est pas encore disponible sur le bot."
                    );

                }

                throw new Error(
                    "Impossible de charger les membres."
                );

            }


            return await response.json();

        }


        /* =========================================
           ACTIONS
        ========================================= */

        function getActions(member) {

            const actions = [];


            if (
                hasPermission(
                    "temp_ban"
                )
            ) {

                actions.push(`
                    <button
                        class="member-action temp-ban"
                        data-action="temp-ban"
                        data-id="${escapeHTML(member.id)}"
                    >
                        ⏱️ Ban temporaire
                    </button>
                `);

            }


            if (
                hasPermission(
                    "perm_ban"
                )
            ) {

                actions.push(`
                    <button
                        class="member-action perm-ban"
                        data-action="perm-ban"
                        data-id="${escapeHTML(member.id)}"
                    >
                        🔨 Ban définitif
                    </button>
                `);

            }


            if (
                hasPermission(
                    "manage_roles"
                )
            ) {

                actions.push(`
                    <button
                        class="member-action role-action"
                        data-action="role"
                        data-id="${escapeHTML(member.id)}"
                    >
                        🛡️ Gérer les rôles
                    </button>
                `);

            }


            if (
                actions.length === 0
            ) {

                return `
                    <span class="member-no-action">
                        Aucune action disponible
                    </span>
                `;

            }


            return `
                <div class="member-actions">
                    ${actions.join("")}
                </div>
            `;

        }


        /* =========================================
           AFFICHAGE
        ========================================= */

        function renderMembers(members) {

            if (
                !Array.isArray(members)
            ) {

                throw new Error(
                    "Format de données membres incorrect."
                );

            }


            if (
                members.length === 0
            ) {

                grid.innerHTML = `
                    <div class="members-message">
                        👥 Aucun membre trouvé.
                    </div>
                `;

                return;

            }


            grid.innerHTML =
                members.map(
                    (member) => {

                        const avatar =
                            member.avatar ||
                            "https://cdn.discordapp.com/embed/avatars/0.png";


                        const username =
                            escapeHTML(
                                member.globalName ||
                                member.username ||
                                "Membre"
                            );


                        const role =
                            escapeHTML(
                                member.role ||
                                "Membre"
                            );


                        return `

                            <article
                                class="member-card"
                            >

                                <div
                                    class="member-card-top"
                                >

                                    <img
                                        src="${avatar}"
                                        alt=""
                                        class="member-avatar"
                                        loading="lazy"
                                    >

                                    <div
                                        class="member-identity"
                                    >

                                        <h2>
                                            ${username}
                                        </h2>

                                        <span>
                                            ${role}
                                        </span>

                                    </div>

                                </div>


                                <div
                                    class="member-id"
                                >
                                    ID :
                                    ${escapeHTML(member.id)}
                                </div>


                                ${getActions(member)}

                            </article>

                        `;

                    }
                )
                .join("");

        }


        /* =========================================
           ACTIONS
        ========================================= */

        document.addEventListener(
            "click",
            (event) => {

                const button =
                    event.target.closest(
                        ".member-action"
                    );


                if (!button) {
                    return;
                }


                const action =
                    button.dataset.action;


                const memberId =
                    button.dataset.id;


                /*
                 * Pour le moment nous n'envoyons
                 * aucune commande dangereuse au bot.
                 *
                 * Les permissions sont déjà contrôlées.
                 * On branchera ensuite chaque action
                 * sur une vraie route sécurisée.
                 */

                if (
                    action === "temp-ban"
                ) {

                    alert(
                        "Ban temporaire sélectionné pour le membre " +
                        memberId +
                        ".\n\nLa commande Discord sera branchée dans l'étape suivante."
                    );

                }


                if (
                    action === "perm-ban"
                ) {

                    alert(
                        "Ban définitif sélectionné pour le membre " +
                        memberId +
                        ".\n\nLa commande Discord sera branchée dans l'étape suivante."
                    );

                }


                if (
                    action === "role"
                ) {

                    alert(
                        "Gestion des rôles sélectionnée pour le membre " +
                        memberId +
                        ".\n\nLa commande Discord sera branchée dans l'étape suivante."
                    );

                }

            }
        );


        /* =========================================
           INITIALISATION
        ========================================= */

        async function initMembers() {

            try {

                loading.hidden = false;

                errorBox.hidden = true;

                grid.innerHTML = "";


                await loadPermissions();


                const members =
                    await loadMembers();


                renderMembers(
                    members
                );


                loading.hidden = true;

            }

            catch (error) {

                console.error(
                    error
                );


                loading.hidden = true;

                errorBox.textContent =
                    "❌ " +
                    error.message;


                errorBox.hidden = false;

            }

        }


        initMembers();

    </script>


    <!-- ==========================================
         STYLE LOCAL DE LA PAGE
    =========================================== -->

    <style>

        .members-page {

            min-height: 100vh;

            padding-top: 110px;

        }


        .members-section {

            width: min(
                1200px,
                92%
            );

            margin: 0 auto;

            padding:
                50px 0 80px;

        }


        .members-header {

            text-align: center;

            margin-bottom: 40px;

        }


        .members-kicker {

            color:
                #00d9ff;

            font-weight: 700;

            letter-spacing:
                2px;

            font-size:
                0.8rem;

        }


        .members-header h1 {

            margin:
                10px 0;

            font-size:
                clamp(
                    2rem,
                    5vw,
                    3.5rem
                );

        }


        .members-header p:last-child {

            max-width:
                700px;

            margin:
                0 auto;

            opacity:
                0.75;

        }


        .members-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap:
                22px;

        }


        .member-card {

            padding:
                22px;

            border-radius:
                18px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.055
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            backdrop-filter:
                blur(12px);

            transition:
                transform 0.25s ease,
                border-color 0.25s ease;

        }


        .member-card:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(
                    0,
                    217,
                    255,
                    0.35
                );

        }


        .member-card-top {

            display:
                flex;

            align-items:
                center;

            gap:
                15px;

        }


        .member-avatar {

            width:
                64px;

            height:
                64px;

            border-radius:
                50%;

            object-fit:
                cover;

        }


        .member-identity h2 {

            margin:
                0 0 5px;

            font-size:
                1.1rem;

        }


        .member-identity span {

            color:
                #00d9ff;

            font-size:
                0.85rem;

        }


        .member-id {

            margin-top:
                18px;

            padding:
                8px 10px;

            border-radius:
                8px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.2
                );

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.5
                );

            font-size:
                0.75rem;

            word-break:
                break-all;

        }


        .member-actions {

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

            margin-top:
                15px;

        }


        .member-action {

            width:
                100%;

            border:
                none;

            border-radius:
                10px;

            padding:
                10px 12px;

            color:
                white;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            cursor:
                pointer;

            font-family:
                inherit;

            text-align:
                left;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        .member-action:hover {

            transform:
                translateX(3px);

            background:
                rgba(
                    0,
                    217,
                    255,
                    0.14
                );

        }


        .members-message {

            padding:
                25px;

            text-align:
                center;

            border-radius:
                15px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

        }


        .members-error {

            color:
                #ff9ca8;

            border:
                1px solid
                rgba(
                    255,
                    70,
                    90,
                    0.25
                );

        }


        .member-no-action {

            display:
                block;

            margin-top:
                15px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

            font-size:
                0.85rem;

        }


        @media (max-width: 600px) {

            .members-section {

                padding-top:
                    30px;

            }

            .members-grid {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</body>

</html>
