<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Membres — La communauté live</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(88,101,242,.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(0,217,255,.08),
                    transparent 35%
                ),
                #080b14;

            color: #f8fafc;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        .page {

            width: min(1400px, 92%);

            margin: auto;

            padding:
                120px 0 60px;

        }

        .header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;

        }

        .header h1 {

            margin: 0 0 8px;

            font-size:
                clamp(2rem, 5vw, 3rem);

        }

        .header p {

            margin: 0;

            color: #94a3b8;

        }

        .back {

            padding:
                12px 18px;

            border-radius:
                12px;

            background:
                rgba(88,101,242,.15);

            border:
                1px solid
                rgba(88,101,242,.3);

            color:
                #c7d2fe;

            text-decoration:
                none;

            transition:
                .2s;

        }

        .back:hover {

            background:
                rgba(88,101,242,.25);

        }

        .toolbar {

            display: flex;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 25px;

        }

        #search {

            flex: 1;

            min-width: 240px;

            padding:
                15px 18px;

            border-radius:
                14px;

            border:
                1px solid
                rgba(255,255,255,.08);

            background:
                rgba(15,23,42,.8);

            color:
                white;

            outline:
                none;

            font-size:
                1rem;

        }

        #search:focus {

            border-color:
                rgba(96,165,250,.5);

        }

        .count {

            display: flex;

            align-items: center;

            padding:
                0 18px;

            border-radius:
                14px;

            background:
                rgba(15,23,42,.8);

            border:
                1px solid
                rgba(255,255,255,.08);

            color:
                #94a3b8;

        }

        .members {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(280px, 1fr)
                );

            gap:
                18px;

        }

        .member {

            display: flex;

            align-items: center;

            gap:
                15px;

            padding:
                18px;

            border-radius:
                18px;

            background:
                rgba(15,23,42,.75);

            border:
                1px solid
                rgba(255,255,255,.07);

            transition:
                .2s ease;

        }

        .member:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(96,165,250,.35);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.2);

        }

        .avatar {

            width:
                58px;

            height:
                58px;

            flex-shrink:
                0;

            border-radius:
                50%;

            object-fit:
                cover;

            background:
                #1e293b;

        }

        .info {

            min-width:
                0;

            flex:
                1;

        }

        .name {

            font-weight:
                700;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

        }

        .username {

            margin-top:
                4px;

            color:
                #64748b;

            font-size:
                .85rem;

        }

        .roles {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                5px;

            margin-top:
                9px;

        }

        .role {

            padding:
                4px 8px;

            border-radius:
                999px;

            background:
                rgba(88,101,242,.14);

            color:
                #c7d2fe;

            border:
                1px solid
                rgba(88,101,242,.25);

            font-size:
                .72rem;

        }

        .bot {

            background:
                rgba(34,197,94,.15);

            color:
                #86efac;

            border-color:
                rgba(34,197,94,.25);

        }

        .message {

            padding:
                30px;

            border-radius:
                18px;

            background:
                rgba(15,23,42,.8);

            color:
                #94a3b8;

        }

        .error {

            color:
                #fca5a5;

            border:
                1px solid
                rgba(248,113,113,.25);

        }

        @media (max-width:700px) {

            .header {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }

            .back {

                text-align:
                    center;

            }

        }

    </style>

</head>


<body>


<nav
    class="navbar"
    id="navbar"
></nav>


<main class="page">


    <section class="header">

        <div>

            <h1>
                👥 Membres
            </h1>

            <p>
                Membres de La communauté live
            </p>

        </div>


        <a
            href="dashboard.html"
            class="back"
        >
            ← Retour au dashboard
        </a>

    </section>


    <section class="toolbar">

        <input
            id="search"
            type="search"
            placeholder="🔎 Rechercher un membre..."
            autocomplete="off"
        >

        <div
            id="count"
            class="count"
        >
            Chargement...
        </div>

    </section>


    <section
        id="members"
        class="members"
    >

        <div class="message">

            🔄 Chargement des membres...

        </div>

    </section>


</main>


<script src="js/navbar.js"></script>


<script>

const API_URL =
    "https://la-communaute-live-bot.de.deplexo.com";


let allMembers = [];


const membersContainer =
    document.getElementById(
        "members"
    );


const searchInput =
    document.getElementById(
        "search"
    );


const count =
    document.getElementById(
        "count"
    );


function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function renderMembers(
    list
) {

    count.textContent =
        `${list.length} membre(s)`;


    if (!list.length) {

        membersContainer.innerHTML = `

            <div class="message">

                🔎 Aucun membre trouvé.

            </div>

        `;

        return;

    }


    membersContainer.innerHTML =

        list.map(
            member => {

                const roles =
                    member.roles || [];


                const rolesHTML =

                    roles.length

                        ?

                        roles

                            .map(
                                role => `

                                    <span
                                        class="role"
                                    >

                                        ${escapeHTML(
                                            role.name
                                        )}

                                    </span>

                                `
                            )

                            .join("")

                        :

                        `

                            <span class="role">

                                @everyone

                            </span>

                        `;


                return `

                    <article class="member">


                        <img

                            class="avatar"

                            src="${escapeHTML(
                                member.avatar
                            )}"

                            alt="Avatar"

                            loading="lazy"

                        >


                        <div class="info">


                            <div class="name">

                                ${escapeHTML(
                                    member.displayName
                                )}

                                ${
                                    member.bot
                                        ?
                                        `
                                            <span class="role bot">
                                                BOT
                                            </span>
                                        `
                                        :
                                        ""
                                }

                            </div>


                            <div class="username">

                                @${escapeHTML(
                                    member.username
                                )}

                            </div>


                            <div class="roles">

                                ${rolesHTML}

                            </div>


                        </div>


                    </article>

                `;

            }
        )

        .join("");

}


async function loadMembers() {

    const token =
        localStorage.getItem(
            "discord_session"
        );


    if (!token) {

        membersContainer.innerHTML = `

            <div class="message error">

                ❌ Tu dois être connecté avec Discord.

            </div>

        `;

        return;

    }


    try {

        const response =
            await fetch(

                `${API_URL}/members`,

                {

                    headers: {

                        Authorization:
                            `Bearer ${token}`

                    }

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(

                data.error ||

                "Impossible de récupérer les membres."

            );

        }


        allMembers =
            data.members || [];


        renderMembers(
            allMembers
        );


    } catch (error) {

        console.error(
            error
        );


        membersContainer.innerHTML = `

            <div class="message error">

                ❌ ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


searchInput.addEventListener(

    "input",

    () => {

        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        if (!query) {

            renderMembers(
                allMembers
            );

            return;

        }


        const filtered =
            allMembers.filter(

                member =>

                    member.displayName
                        .toLowerCase()
                        .includes(query)

                    ||

                    member.username
                        .toLowerCase()
                        .includes(query)

                    ||

                    member.roles.some(

                        role =>

                            role.name
                                .toLowerCase()
                                .includes(query)

                    )

            );


        renderMembers(
            filtered
        );

    }

);


loadMembers();

</script>


</body>

</html>
