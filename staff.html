<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Staff - La communauté live</title>

    <meta
        name="description"
        content="Découvrez l'équipe de La communauté live."
    >

    <link rel="icon" href="images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="ccs/style.css">


    <!-- ==================================================
         STYLE SPÉCIFIQUE AU STAFF
    ================================================== -->

    <style>

        .staff-page {
            padding: 120px 40px 60px;
        }


        .staff-title {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 15px;
        }


        .staff-subtitle {
            text-align: center;
            color: #bfc8ff;
            margin-bottom: 50px;
        }


        .role {
            margin-bottom: 60px;
        }


        .role-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 25px;
            padding-left: 15px;
            border-left: 8px solid white;
        }


        .members {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );
            gap: 25px;
        }


        .staff-card {
            background: rgba(255,255,255,.06);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: .3s;
            border: 2px solid rgba(255,255,255,.08);
            box-shadow: 0 0 20px rgba(0,255,255,.12);
        }


        .staff-card:hover {
            transform: translateY(-8px);
            box-shadow:
                0 0 30px rgba(0,255,255,.35);
        }


        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            object-fit: cover;
            margin-bottom: 20px;
        }


        .username {
            font-size: 1.4rem;
            font-weight: 700;
        }


        .display {
            color: #c8d0ff;
            margin-top: 8px;
            word-break: break-word;
        }


        .profile {
            display: inline-block;
            margin-top: 18px;
            text-decoration: none;
            color: white;
            background: #5865F2;
            padding: 10px 20px;
            border-radius: 30px;
            transition: .3s;
        }


        .profile:hover {
            transform: scale(1.05);
        }


        .empty {
            color: #999;
            font-style: italic;
        }


        @media (max-width: 700px) {

            .staff-page {
                padding-left: 20px;
                padding-right: 20px;
            }


            .staff-title {
                font-size: 2.2rem;
            }

        }

    </style>

</head>


<body>

<canvas id="particles"></canvas>


<!-- ==================================================
     NAVIGATION
     Chargée depuis js/navbar.js
================================================== -->

<nav
    class="navbar"
    id="navbar"
></nav>


<!-- ==================================================
     STAFF
================================================== -->

<main class="staff-page">

    <h1 class="staff-title">
        👑 Notre Staff
    </h1>

    <p class="staff-subtitle">
        Les informations sont synchronisées automatiquement
        avec Discord.
    </p>


    <div id="staff">

        <div class="feature">

            <h3>
                ⏳ Chargement...
            </h3>

            <p>
                Récupération de l'équipe depuis Discord.
            </p>

        </div>

    </div>

</main>


<!-- ==================================================
     FOOTER
================================================== -->

<footer>

    © 2026 La communauté live

</footer>


<!-- ==================================================
     JAVASCRIPT
================================================== -->

<!-- 🧠 Navbar centrale -->
<script src="js/navbar.js"></script>


<!-- Staff Discord -->

<script>

async function chargerStaff() {

    try {

        const response =
            await fetch(
                "https://la-communaute-live-bot.de.deplexo.com/staff"
            );


        if (!response.ok) {

            throw new Error(
                "Erreur HTTP " + response.status
            );

        }


        const roles =
            await response.json();


        const container =
            document.getElementById("staff");


        container.innerHTML = "";


        if (
            !roles ||
            roles.length === 0
        ) {

            container.innerHTML = `

                <div class="feature">

                    <h3>
                        👑 Aucun staff disponible
                    </h3>

                    <p>
                        Les informations du staff ne sont pas
                        actuellement disponibles.
                    </p>

                </div>

            `;

            return;

        }


        roles.forEach(role => {

            let html = `

                <div class="role">

                    <h2
                        class="role-title"
                        style="
                            border-color:${role.color};
                            color:${role.color};
                        "
                    >
                        ${role.role}
                    </h2>

                    <div class="members">

            `;


            if (
                !role.members ||
                role.members.length === 0
            ) {

                html += `

                    <p class="empty">
                        Aucun membre.
                    </p>

                `;

            }
            else {

                role.members.forEach(member => {

                    html += `

                        <div class="staff-card">

                            <img
                                class="avatar"
                                src="${member.avatar}"
                                alt="${member.username}"
                            >

                            <div class="username">
                                ${member.username}
                            </div>

                            <div class="display">
                                ${member.displayName}
                            </div>

                            <a
                                class="profile"
                                href="${member.profile}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                Voir le profil
                            </a>

                        </div>

                    `;

                });

            }


            html += `

                    </div>

                </div>

            `;


            container.innerHTML += html;

        });

    }
    catch (error) {

        console.error(error);


        document.getElementById("staff").innerHTML = `

            <div class="feature">

                <h3>
                    ❌ Impossible de charger le staff
                </h3>

                <p>
                    Vérifie que le bot Discord est bien connecté.
                </p>

            </div>

        `;

    }

}


chargerStaff();


setInterval(
    chargerStaff,
    60000
);

</script>


<!-- Animations + menu mobile -->
<script src="js/app.js"></script>


</body>

</html>
